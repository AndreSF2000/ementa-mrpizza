<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>MR. Pizza — Preçário (TV)</title>
<style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        position: fixed;
        inset: 0;
        cursor: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, sans-serif;
    }

    #ecra {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
    }

    /*
     * Palco: caixa com a proporção exata da imagem.
     * A imagem é desenhada sem esticar nem cortar (nunca se perde uma coluna
     * de preços, mesmo que a janela da TV não seja 16:9) e o logótipo fica
     * sempre colado à imagem, porque também vive dentro do palco.
     */
    #palco {
        position: relative;
        flex: 0 0 auto;
        overflow: hidden;
        background: #000;
        transform: translateZ(0);
    }

    /* Camada 1 — preçário original (PNG sem perdas) */
    #palco > #precario {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        image-rendering: auto;
    }

    /* Camada 2 — logótipo animado (o fundo verde é removido em tempo real) */
    #logotipo {
        position: absolute;
        left: 6.6%;
        top: 59%;
        width: 12%;
        aspect-ratio: 456 / 418;
        height: auto;
        z-index: 2;
        pointer-events: none;
    }

    /* reserva estática, se o vídeo não arrancar */
    #logotipo-png {
        position: absolute;
        left: 5%;
        top: 57%;
        width: 11.5%;
        z-index: 2;
        pointer-events: none;
    }

    /* vídeo-fonte: fora do ecrã, mas a descodificar */
    #fonte-logotipo {
        position: absolute;
        left: -20px;
        top: -20px;
        width: 2px;
        height: 2px;
        opacity: .01;
        pointer-events: none;
        z-index: -1;
    }

    #aviso {
        position: fixed;
        left: 14px;
        bottom: 14px;
        z-index: 99;
        display: none;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, .72);
        color: #fff;
        font: 500 14px/1.3 system-ui, sans-serif;
    }

    /* Aviso de atualização: aparece quando o ficheiro muda no GitHub */
    #aviso-atualizacao {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: .35em;
        background: rgba(0, 0, 0, .82);
        color: #fff;
        text-align: center;
        font: 600 clamp(22px, 2.4vw, 48px)/1.2 system-ui, sans-serif;
    }

    #aviso-atualizacao p { margin: 0; }

    #aviso-atualizacao #contagem {
        color: #4ade80;
        font-size: 1.7em;
        font-variant-numeric: tabular-nums;
    }
</style>
</head>
<body>

<div id="ecra">
    <div id="palco"></div>
</div>

<script>
/* ------------------------------------------------------------------
   CONFIGURAÇÃO
   ------------------------------------------------------------------ */
const ASSETS = {
    // Preçário original. Substituir por um ficheiro 4K (3840x2160) faz com
    // que seja desenhado a 1:1 nas TVs 4K, sem ampliação.
    precario: 'menu-tv-fixo.png',
    // Vídeo do chef sobre fundo verde (o verde é removido no browser).
    logotipo: 'mrpizza.mp4',
    // Reserva estática, usada só se o vídeo não arrancar.
    logotipoReserva: 'logotipo-chef.png'
};

// Muda quando substituíres algum ficheiro (força o browser a ir buscá-lo)
const VERSAO = '2026-10-24d';

/* ------------------------------------------------------------------ */

const palco = document.getElementById('palco');

let proporcao = 16 / 9;
let temporizadores = [];

function comVersao(url) {
    return url + (url.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(VERSAO);
}

/* Palco com a proporção exata da imagem, em pixels inteiros */
function ajustarPalco(ar) {
    if (!ar || !isFinite(ar) || ar <= 0) ar = 16 / 9;
    proporcao = ar;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let largura = vw;
    let altura = vw / ar;
    if (altura > vh) {
        altura = vh;
        largura = vh * ar;
    }

    palco.style.width = Math.round(largura) + 'px';
    palco.style.height = Math.round(altura) + 'px';
}

function aviso(mensagem) {
    let el = document.getElementById('aviso');
    if (!el) {
        el = document.createElement('div');
        el.id = 'aviso';
        document.body.appendChild(el);
    }
    el.textContent = mensagem;
    el.style.display = 'block';
}

function limparAviso() {
    const el = document.getElementById('aviso');
    if (el) el.remove();
}

/* Camada 1: imagem do preçário */
function carregarPrecario() {
    const img = document.createElement('img');
    img.id = 'precario';
    img.alt = 'Preçário Mr. Pizza';
    img.decoding = 'async';

    const tentar = () => { img.src = comVersao(ASSETS.precario); };

    img.addEventListener('load', async () => {
        ajustarPalco(img.naturalWidth / img.naturalHeight);
        palco.appendChild(img);
        try { await img.decode(); } catch (e) {}
        limparAviso();
    });

    img.addEventListener('error', () => {
        if (img.parentNode) img.remove();
        aviso('Preçário sem ligação — a tentar novamente…');
        const id = setTimeout(tentar, 4000);
        temporizadores.push(id);
    });

    tentar();

    return img;
}

/*
 * Camada 2: logótipo animado.
 * O vídeo tem fundo verde liso; cada fotograma é recortado num canvas, com
 * tolerância nas bordas e limpeza do "derrame" verde. A zona da marca de
 * água (canto inferior direito) fica fora do recorte.
 */
const CORTE = { x: 350, y: 146, l: 456, a: 418 };

function carregarLogotipo() {
    const fonte = document.createElement('video');
    fonte.id = 'fonte-logotipo';
    fonte.muted = true;
    fonte.defaultMuted = true;
    fonte.loop = true;
    fonte.autoplay = true;
    fonte.playsInline = true;
    fonte.setAttribute('playsinline', '');
    fonte.setAttribute('muted', '');
    fonte.preload = 'auto';
    fonte.src = comVersao(ASSETS.logotipo);
    document.body.appendChild(fonte);
    fonte.play().catch(() => {});

    const canvas = document.createElement('canvas');
    canvas.id = 'logotipo';
    canvas.width = CORTE.l;
    canvas.height = CORTE.a;
    palco.appendChild(canvas);

    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let ultimoTempo = -1;
    let ultimoPintado = 0;
    let arrancou = false;

    function desenhar() {
        requestAnimationFrame(desenhar);

        if (document.hidden || fonte.readyState < 2) return;
        if (fonte.currentTime === ultimoTempo) return;

        const agora = performance.now();
        if (agora - ultimoPintado < 66) return;   // ~15 fps é suficiente para o chef
        ultimoPintado = agora;
        ultimoTempo = fonte.currentTime;

        ctx.clearRect(0, 0, CORTE.l, CORTE.a);
        ctx.drawImage(fonte, CORTE.x, CORTE.y, CORTE.l, CORTE.a, 0, 0, CORTE.l, CORTE.a);

        const img = ctx.getImageData(0, 0, CORTE.l, CORTE.a);
        const d = img.data;

        for (let i = 0; i < d.length; i += 4) {
            const r = d[i], g = d[i + 1], b = d[i + 2];
            const verde = g - (r > b ? r : b);

            if (verde > 45) {          // fundo verde
                d[i + 3] = 0;
                continue;
            }
            if (verde > 20) {          // borda: transparência parcial
                d[i + 3] = (255 * (45 - verde) / 25) | 0;
            }
            const alvo = (r + b) / 2;  // limpeza do verde nos contornos
            if (g > alvo) d[i + 1] = alvo | 0;
        }

        ctx.putImageData(img, 0, 0);
        arrancou = true;
    }

    desenhar();

    // Se o vídeo não arrancar em 8 s, mostra o recorte estático
    const limite = setTimeout(() => {
        if (arrancou || fonte.readyState >= 2) return;
        const img = document.createElement('img');
        img.id = 'logotipo-png';
        img.alt = '';
        img.src = comVersao(ASSETS.logotipoReserva);
        img.addEventListener('error', () => img.remove());
        palco.appendChild(img);
    }, 8000);
    temporizadores.push(limite);
}

carregarPrecario();
carregarLogotipo();

window.addEventListener('resize', () => ajustarPalco(proporcao));

/* Ecrã cheio com um clique/toque no telecomando */
document.addEventListener('click', async () => {
    if (!document.fullscreenElement) {
        try {
            await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
        } catch (e) {}
    }
});

/* Evita que o ecrã entre em suspensão (Chrome/Android TV) */
async function manterAcordado() {
    try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
    } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) manterAcordado();
});
manterAcordado();

/* ------------------------------------------------------------------
   Atualizações automáticas
   A página verifica de vez em quando se o ficheiro no GitHub mudou.
   Se mudou, mostra o aviso 5 s e recarrega com a versão nova.
   ------------------------------------------------------------------ */
const INTERVALO_VERIFICACAO = 20000; // 20 s
const SEGUNDOS_AVISO = 5;

let marcaServidor = null;
let aAtualizar = false;

async function marcaDoServidor() {
    try {
        // HEAD com cache desligada: não descarrega a página, só lê os cabeçalhos
        const resposta = await fetch(location.pathname + '?ver=' + Date.now(), {
            method: 'HEAD',
            cache: 'no-store'
        });
        if (!resposta.ok) return null;
        return (resposta.headers.get('etag') || '') + '|' + (resposta.headers.get('last-modified') || '');
    } catch (e) {
        return null; // sem rede: ignora e tenta na próxima
    }
}

function avisarAtualizacao() {
    if (aAtualizar) return;
    aAtualizar = true;

    const caixa = document.createElement('div');
    caixa.id = 'aviso-atualizacao';
    caixa.innerHTML = '<p>A atualizar o preçário…</p><p id="contagem">' + SEGUNDOS_AVISO + '</p>';
    document.body.appendChild(caixa);

    let restantes = SEGUNDOS_AVISO;
    const contador = setInterval(() => {
        restantes--;
        const numero = document.getElementById('contagem');
        if (numero) numero.textContent = restantes > 0 ? restantes : '…';
        if (restantes <= 0) {
            clearInterval(contador);
            location.reload();
        }
    }, 1000);
}

async function verificarAtualizacao() {
    if (aAtualizar || document.hidden) return;

    const marca = await marcaDoServidor();
    if (!marca) return;

    if (marcaServidor === null) {
        marcaServidor = marca;
        return;
    }
    if (marca !== marcaServidor) avisarAtualizacao();
}

(async () => {
    marcaServidor = await marcaDoServidor();
    setInterval(verificarAtualizacao, INTERVALO_VERIFICACAO);
})();
</script>

</body>
</html>
