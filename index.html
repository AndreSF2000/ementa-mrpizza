<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR. Pizza - TV Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: none;
        }

        .display-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: var(--bg-color, #000); 
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
            pointer-events: none;
            display: block;
        }

        /* Fallback para imagem estática */
        img.price-sheet {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            background-color: transparent;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            transition: opacity 0.5s ease-out;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #fff;
            font-size: 2rem;
            text-align: center;
            padding: 2rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="display-container" id="displayArea">
        <div class="loading-overlay" id="loader">
            <div class="spinner"></div>
            <p>A carregar conteúdo...</p>
        </div>
    </div>

    <script>
        const ASSETS = {
            video: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menus-mr-ermesinde-out-2026.mp4",
            price: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menu-tv-fixo.png"
        };

        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') || 'video';
        const bgColor = params.get('bg') || '000000'; 

        const displayArea = document.getElementById('displayArea');
        const loader = document.getElementById('loader');

        // Aplicar a cor de fundo personalizada
        document.documentElement.style.setProperty('--bg-color', `#${bgColor}`);

        function hideLoader() {
            if (loader && loader.parentNode) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    if (loader.parentNode) loader.remove();
                }, 500);
            }
        }

        function initDisplay() {
            if (mode === 'video') {
                renderVideo();
            } else if (mode === 'price') {
                renderPriceAsVideo();
            } else {
                showError("Modo inválido. Use ?mode=video ou ?mode=price");
            }
        }

        function renderVideo() {
            const video = document.createElement('video');
            video.src = ASSETS.video;
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.playsInline = true;
            video.preload = 'auto';
            video.crossOrigin = 'anonymous';
            video.setAttribute('playsinline', '');
            video.setAttribute('controls', 'false');
            video.setAttribute('disableRemotePlayback', 'true');
            video.setAttribute('disablePictureInPicture', 'true');
            video.setAttribute('controlsList', 'nodownload noremoteplayback noplaybackrate');

            let stallCount = 0;
            const maxStallsBeforeReload = 3;

            video.addEventListener('stalled', () => {
                stallCount++;
                if (stallCount >= maxStallsBeforeReload) {
                    const currentTime = video.currentTime;
                    video.currentTime = Math.max(0, currentTime - 0.1);
                    video.play().catch(() => {});
                    stallCount = 0;
                }
            });

            video.addEventListener('timeupdate', () => {
                if (stallCount > 0) stallCount = 0;
            });

            video.onerror = () => {
                showError("Erro ao carregar vídeo. Verifique a internet.");
            };

            displayArea.appendChild(video);
            
            // Esconder loader assim que houver dados suficientes para reproduzir
            video.addEventListener('loadeddata', hideLoader);
            video.addEventListener('canplay', hideLoader);
            
            video.play().catch(error => {
                console.log("Autoplay inicial bloqueado, tentando novamente", error);
                setTimeout(() => video.play().catch(e => console.error("Autoplay falhou", e)), 500);
            });
        }

        async function renderPriceAsVideo() {
            try {
                // 1. Carregar a Imagem
                const img = await loadImage(ASSETS.price);
                
                // 2. Criar Canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                
                // Definir tamanho do canvas para 1080p
                canvas.width = 1920;
                canvas.height = 1080;

                // 3. Desenhar a Imagem no Canvas (object-fit: contain simulado)
                drawImageContained(ctx, img, canvas.width, canvas.height);

                // Adicionar o Canvas ao DOM imediatamente
                displayArea.appendChild(canvas);
                
                // 4. Verificar se MediaRecorder está disponível
                if (!window.MediaRecorder) {
                    console.warn("MediaRecorder não suportado, a usar Canvas estático com blink");
                    startCanvasBlink(canvas, ctx, img);
                    hideLoader();
                    return;
                }

                // 5. Configurar o Stream de Vídeo
                const stream = canvas.captureStream(30); // 30 FPS
                
                // Determinar o melhor codec disponível
                let mimeType = 'video/webm;codecs=vp9';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'video/webm;codecs=vp8';
                }
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'video/webm';
                }
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    // Fallback para Canvas Blink se não houver codec de vídeo
                    console.warn("Nenhum codec de vídeo suportado, a usar Canvas estático com blink");
                    startCanvasBlink(canvas, ctx, img);
                    hideLoader();
                    return;
                }

                const mediaRecorder = new MediaRecorder(stream, {
                    mimeType: mimeType,
                    videoBitsPerSecond: 5000000 // 5 Mbps
                });

                const chunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        chunks.push(e.data);
                    }
                };

                let isRecording = true;
                let hasPlayedOnce = false;

                mediaRecorder.onstop = () => {
                    if (!isRecording) return;
                    
                    const blob = new Blob(chunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    
                    // Remover o Canvas e substituir pelo Vídeo
                    const parent = canvas.parentNode;
                    if (parent) parent.removeChild(canvas);

                    const video = document.createElement('video');
                    video.src = url;
                    video.autoplay = true;
                    video.loop = true;
                    video.muted = true;
                    video.playsInline = true;
                    video.setAttribute('playsinline', '');
                    video.setAttribute('controls', 'false');
                    video.setAttribute('disableRemotePlayback', 'true');
                    video.setAttribute('disablePictureInPicture', 'true');

                    displayArea.appendChild(video);
                    
                    // Esconder loader apenas quando o vídeo estiver a tocar
                    const onCanPlay = () => {
                        hideLoader();
                        video.removeEventListener('canplay', onCanPlay);
                    };
                    video.addEventListener('canplay', onCanPlay);
                    
                    video.play().catch(e => {
                        console.error("Erro ao reproduzir vídeo gerado", e);
                        // Fallback para Canvas Blink se o vídeo falhar
                        startCanvasBlink(canvas, ctx, img);
                        hideLoader();
                    });
                };

                // Iniciar Gravação
                mediaRecorder.start(1000); // Recolher dados a cada 1 segundo

                // Loop de Animação (Para evitar Sleep Mode)
                let frameCount = 0;
                const fps = 30;
                const durationMs = 10000; // 10 segundos por "loop"

                function animate() {
                    if (!isRecording) return;

                    // Atualizar o canvas com uma variação mínima de brilho
                    const brightness = 1 + Math.sin(frameCount * 0.05) * 0.01; // Variação de 1%
                    ctx.filter = `brightness(${brightness})`;
                    drawImageContained(ctx, img, canvas.width, canvas.height);
                    ctx.filter = 'none';

                    frameCount++;
                    
                    // Parar a gravação após 10 segundos e reiniciar
                    if (frameCount >= fps * (durationMs / 1000)) {
                        mediaRecorder.stop();
                        mediaRecorder.start(1000); // Reiniciar gravação
                        frameCount = 0;
                    }

                    requestAnimationFrame(animate);
                }

                animate();

            } catch (error) {
                console.error("Erro ao gerar vídeo da imagem", error);
                fallbackStaticImage();
            }
        }

        function startCanvasBlink(canvas, ctx, img) {
            // Usado quando MediaRecorder não está disponível
            let frameCount = 0;
            function blinkLoop() {
                const brightness = 1 + Math.sin(frameCount * 0.05) * 0.01;
                ctx.filter = `brightness(${brightness})`;
                drawImageContained(ctx, img, canvas.width, canvas.height);
                ctx.filter = 'none';
                frameCount++;
                requestAnimationFrame(blinkLoop);
            }
            blinkLoop();
        }

        function fallbackStaticImage() {
            const imgElement = document.createElement('img');
            imgElement.src = ASSETS.price;
            imgElement.alt = "Preçário MR. Pizza";
            imgElement.className = 'price-sheet';
            imgElement.crossOrigin = 'anonymous';

            imgElement.onerror = () => {
                showError("Erro ao carregar preçário.");
            };

            imgElement.onload = hideLoader;
            displayArea.appendChild(imgElement);
        }

        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        function drawImageContained(ctx, img, targetWidth, targetHeight) {
            // Limpar o canvas com a cor de fundo
            const bgHex = document.documentElement.style.getPropertyValue('--bg-color').replace('#', '').trim() || '000000';
            ctx.fillStyle = `#${bgHex}`;
            ctx.fillRect(0, 0, targetWidth, targetHeight);

            // Calcular escala para "contain" (manter proporção)
            const imgAspect = img.width / img.height;
            const canvasAspect = targetWidth / targetHeight;
            
            let drawWidth, drawHeight;
            
            if (imgAspect > canvasAspect) {
                drawWidth = targetWidth;
                drawHeight = targetWidth / imgAspect;
            } else {
                drawHeight = targetHeight;
                drawWidth = targetHeight * imgAspect;
            }

            const offsetX = (targetWidth - drawWidth) / 2;
            const offsetY = (targetHeight - drawHeight) / 2;

            ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
        }

        function showError(message) {
            loader.innerHTML = `
                <div style="text-align: center;">
                    <h1 style="font-size: 3rem; margin-bottom: 1rem;">⚠️</h1>
                    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">${message}</h2>
                    <p style="font-size: 1rem; opacity: 0.7;">A tentar recarregar automaticamente em 10 segundos...</p>
                </div>
            `;
            loader.style.opacity = '1';
            loader.style.display = 'flex';
            setTimeout(() => window.location.reload(), 10000);
        }

        initDisplay();

        window.addEventListener('resize', () => {
            const video = document.querySelector('video');
            if (video && video.paused) video.play().catch(() => {});
        });
    </script>
</body>
</html>
