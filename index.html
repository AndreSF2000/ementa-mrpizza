<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MR. Pizza - TV Display</title>
    <style>
        /* Reset Agresivo para TVs */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Evita scrollbars */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: none;
            /* Impede gestos de zoom/pinch na TV */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Container Fixo: Garante que ocupa exatamente o ecrã */
        .display-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color, #000); 
            z-index: 1;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: transparent;
            pointer-events: none;
            display: block;
        }

        img.price-sheet {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            background-color: transparent;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            transition: opacity 0.3s ease-out;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #fff;
            font-size: 2rem;
            text-align: center;
            padding: 2rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="display-container" id="displayArea">
        <div class="loading-overlay" id="loader">
            <div class="spinner"></div>
            <p>A carregar conteúdo...</p>
        </div>
    </div>

    <script>
        const ASSETS = {
            video: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menus-mr-ermesinde-out-2026.mp4",
            price: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menu-tv-fixo.png"
        };

        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') || 'video';
        const bgColor = params.get('bg') || '000000'; 

        const displayArea = document.getElementById('displayArea');
        const loader = document.getElementById('loader');

        // Aplicar a cor de fundo personalizada
        document.documentElement.style.setProperty('--bg-color', `#${bgColor}`);

        function hideLoader() {
            if (loader && loader.parentNode) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    if (loader.parentNode) loader.remove();
                }, 300);
            }
        }

        function initDisplay() {
            if (mode === 'video') {
                renderVideo();
            } else if (mode === 'price') {
                renderPriceAsVideo();
            } else {
                showError("Modo inválido. Use ?mode=video ou ?mode=price");
            }
        }

        function renderVideo() {
            const video = document.createElement('video');
            video.src = ASSETS.video;
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.playsInline = true;
            video.preload = 'auto';
            video.crossOrigin = 'anonymous';
            video.setAttribute('playsinline', '');
            video.setAttribute('controls', 'false');
            video.setAttribute('disableRemotePlayback', 'true');
            video.setAttribute('disablePictureInPicture', 'true');
            video.setAttribute('controlsList', 'nodownload noremoteplayback noplaybackrate');

            let stallCount = 0;
            const maxStallsBeforeReload = 3;

            video.addEventListener('stalled', () => {
                stallCount++;
                if (stallCount >= maxStallsBeforeReload) {
                    const currentTime = video.currentTime;
                    video.currentTime = Math.max(0, currentTime - 0.1);
                    video.play().catch(() => {});
                    stallCount = 0;
                }
            });

            video.addEventListener('timeupdate', () => {
                if (stallCount > 0) stallCount = 0;
            });

            video.onerror = () => {
                showError("Erro ao carregar vídeo. Verifique a internet.");
            };

            displayArea.appendChild(video);
            
            video.addEventListener('loadeddata', hideLoader);
            video.addEventListener('canplay', hideLoader);
            
            video.play().catch(error => {
                console.log("Autoplay inicial bloqueado, tentando novamente", error);
                setTimeout(() => video.play().catch(e => console.error("Autoplay falhou", e)), 500);
            });
        }

        async function renderPriceAsVideo() {
            try {
                // 1. Carregar a Imagem AGORA
                const img = await loadImage(ASSETS.price);
                
                // 2. Criar Canvas APENAS DEPOIS da imagem estar carregada
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                
                canvas.width = 1920;
                canvas.height = 1080;

                // 3. Desenhar a Imagem no Canvas
                drawImageContained(ctx, img, canvas.width, canvas.height);

                // 4. Adicionar o Canvas ao DOM
                displayArea.appendChild(canvas);

                // 5. Iniciar o Blink Subtil (Anti-Sleep)
                startCanvasBlink(canvas, ctx, img);

                // 6. Esconder o Loader
                hideLoader();

            } catch (error) {
                console.error("Erro ao gerar vídeo da imagem", error);
                fallbackStaticImage();
            }
        }

        function startCanvasBlink(canvas, ctx, img) {
            let frameCount = 0;
            function blinkLoop() {
                const brightness = 1 + Math.sin(frameCount * 0.05) * 0.01;
                ctx.filter = `brightness(${brightness})`;
                drawImageContained(ctx, img, canvas.width, canvas.height);
                ctx.filter = 'none';
                frameCount++;
                requestAnimationFrame(blinkLoop);
            }
            blinkLoop();
        }

        function fallbackStaticImage() {
            const imgElement = document.createElement('img');
            imgElement.src = ASSETS.price;
            imgElement.alt = "Preçário MR. Pizza";
            imgElement.className = 'price-sheet';
            imgElement.crossOrigin = 'anonymous';

            imgElement.onerror = () => {
                showError("Erro ao carregar preçário.");
            };

            imgElement.onload = hideLoader;
            displayArea.appendChild(imgElement);
        }

        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        function drawImageContained(ctx, img, targetWidth, targetHeight) {
            const bgHex = document.documentElement.style.getPropertyValue('--bg-color').replace('#', '').trim() || '000000';
            ctx.fillStyle = `#${bgHex}`;
            ctx.fillRect(0, 0, targetWidth, targetHeight);

            const imgAspect = img.width / img.height;
            const canvasAspect = targetWidth / targetHeight;
            
            let drawWidth, drawHeight;
            
            if (imgAspect > canvasAspect) {
                drawWidth = targetWidth;
                drawHeight = targetWidth / imgAspect;
            } else {
                drawHeight = targetHeight;
                drawWidth = targetHeight * imgAspect;
            }

            const offsetX = (targetWidth - drawWidth) / 2;
            const offsetY = (targetHeight - drawHeight) / 2;

            ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
        }

        function showError(message) {
            loader.innerHTML = `
                <div style="text-align: center;">
                    <h1 style="font-size: 3rem; margin-bottom: 1rem;">⚠️</h1>
                    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">${message}</h2>
                    <p style="font-size: 1rem; opacity: 0.7;">A tentar recarregar automaticamente em 10 segundos...</p>
                </div>
            `;
            loader.style.opacity = '1';
            loader.style.display = 'flex';
            setTimeout(() => window.location.reload(), 10000);
        }

        initDisplay();

        window.addEventListener('resize', () => {
            const video = document.querySelector('video');
            if (video && video.paused) video.play().catch(() => {});
        });
    </script>
</body>
</html>
