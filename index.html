<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MR. Pizza - TV Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* O SEGREDO: Vídeo com otimização de nitidez e contraste */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100vw;
            min-height: 100vh;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background-color: #000;
            z-index: -1;
            pointer-events: none;
            /* Otimização de Nitidez */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            /* Aumento de Contraste e Saturação para texto mais nítido */
            filter: contrast(1.05) saturate(1.1);
            /* Aceleração de Hardware */
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* Imagem Fallback com Animação de Segurança e Nitidez */
        #fallback-img {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100vw;
            min-height: 100vh;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background-color: #000;
            z-index: -1;
            pointer-events: none;
            display: none;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            filter: contrast(1.05) saturate(1.1);
            animation: subtleBlink 2s ease-in-out infinite;
        }

        @keyframes subtleBlink {
            0%, 100% { filter: contrast(1.05) saturate(1.1) brightness(1); }
            50% { filter: contrast(1.05) saturate(1.1) brightness(1.01); }
        }

        /* Loader */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            transition: opacity 0.3s ease-out;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- VÍDEO ESTÁTICO NO DOM -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source id="video-source" src="" type="video/mp4">
        O seu navegador não suporta vídeos.
    </video>

    <!-- IMAGEM FALLBACK COM ANIMAÇÃO -->
    <img id="fallback-img" src="" alt="Preçário MR. Pizza">

    <!-- LOADER -->
    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <p>A carregar conteúdo...</p>
    </div>

    <script>
        const ASSETS = {
            video: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menus-mr-ermesinde-out-2026.mp4",
            priceVideo: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/refs/heads/main/precario-video.mp4",
            price: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menu-tv-fixo.png"
        };

        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') || 'video';

        const video = document.getElementById('bg-video');
        const videoSource = document.getElementById('video-source');
        const fallbackImg = document.getElementById('fallback-img');
        const loader = document.getElementById('loader');

        function hideLoader() {
            if (loader && loader.parentNode) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    if (loader.parentNode) loader.remove();
                }, 300);
            }
        }

        function showFallback() {
            video.style.display = 'none';
            fallbackImg.src = ASSETS.price;
            fallbackImg.style.display = 'block';
            hideLoader();
        }

        function initDisplay() {
            if (mode === 'video') {
                loadVideo(ASSETS.video);
            } else if (mode === 'price') {
                loadVideo(ASSETS.priceVideo, true);
            } else {
                showError("Modo inválido. Use ?mode=video ou ?mode=price");
            }
        }

        function loadVideo(src, hasFallback = false) {
            videoSource.src = src;
            video.load();
            
            let hasStarted = false;
            
            const loadTimeout = setTimeout(() => {
                if (!hasStarted) {
                    console.error("Timeout: Vídeo não carregou em 8s");
                    if (hasFallback) {
                        showFallback();
                    } else {
                        showError("Erro ao carregar vídeo. Verifique a internet.");
                    }
                }
            }, 8000);

            const checkInterval = setInterval(() => {
                if (video.readyState >= 2) {
                    clearInterval(checkInterval);
                    if (!hasStarted) {
                        hasStarted = true;
                        hideLoader();
                        video.play().catch(e => console.error("Autoplay falhou", e));
                    }
                }
            }, 500);

            video.addEventListener('canplay', () => {
                if (!hasStarted) {
                    hasStarted = true;
                    hideLoader();
                    video.play().catch(e => console.error("Autoplay falhou", e));
                }
            });

            video.addEventListener('loadeddata', () => {
                if (!hasStarted) {
                    hasStarted = true;
                    hideLoader();
                    video.play().catch(e => console.error("Autoplay falhou", e));
                }
            });

            video.addEventListener('error', () => {
                console.error("Erro ao carregar vídeo:", src);
                clearInterval(checkInterval);
                clearTimeout(loadTimeout);
                if (hasFallback) {
                    showFallback();
                } else {
                    showError("Erro ao carregar vídeo. Verifique a internet.");
                }
            });

            video.play().catch(error => {
                console.log("Autoplay inicial bloqueado, tentando novamente", error);
                setTimeout(() => video.play().catch(e => console.error("Autoplay falhou", e)), 500);
            });
        }

        function showError(message) {
            loader.innerHTML = `
                <div style="text-align: center;">
                    <h1 style="font-size: 3rem; margin-bottom: 1rem;">⚠️</h1>
                    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">${message}</h2>
                    <p style="font-size: 1rem; opacity: 0.7;">A tentar recarregar automaticamente em 10 segundos...</p>
                </div>
            `;
            loader.style.opacity = '1';
            loader.style.display = 'flex';
            setTimeout(() => window.location.reload(), 10000);
        }

        initDisplay();

        window.addEventListener('resize', () => {
            if (video && video.paused) video.play().catch(() => {});
        });
    </script>
</body>
</html>
