<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Display</title>
    <style>
        /* Reset e Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000; /* Fundo preto para contraste */
            overflow: hidden; /* Evita scrollbars na TV */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container Principal */
        .display-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Estilo para Vídeo */
        video {
            /* object-fit: cover garante que o vídeo preenche a tela inteira 
               cortando as bordas se necessário, mas mantendo a proporção. 
               É a melhor opção para TVs de diferentes tamanhos. */
            width: 100%;
            height: 100%;
            object-fit: cover; 
            background-color: #000;
        }

        /* Estilo para Imagem (Preçário) */
        img.price-sheet {
            /* object-fit: contain para o preçário. 
               É melhor "contain" aqui porque preçários têm texto. 
               Se usarmos "cover", o texto pode ser cortado. 
               O preto ao redor fica elegante. */
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            background-color: #000;
            /* Opcional: adicionar um leve padding para não tocar nas bordas */
            padding: 2%;
            max-width: 100%;
            max-height: 100%;
        }

        /* Mensagem de Erro (visível apenas se falhar o carregamento) */
        .error-message {
            color: #fff;
            font-size: 2rem;
            text-align: center;
            padding: 2rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="display-container" id="displayArea">
        <!-- O conteúdo será injetado via JS -->
    </div>

    <script>
        // Configuração: Substitua pelos seus links RAW do GitHub
        const ASSETS = {
            video: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menus-mr-ermesinde-out-2026.mp4",
            price: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menu-tv-fixo.png"
        };

        // Determinar o modo via URL (?mode=video ou ?mode=price)
        // Se não houver parâmetro, assume "video" por padrão
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') || 'video';
        const displayArea = document.getElementById('displayArea');

        function initDisplay() {
            if (mode === 'video') {
                renderVideo();
            } else if (mode === 'price') {
                renderPrice();
            } else {
                showError("Modo inválido. Use ?mode=video ou ?mode=price");
            }
        }

        function renderVideo() {
            const video = document.createElement('video');
            
            // Atributos críticos para TVs
            video.src = ASSETS.video;
            video.autoplay = true;
            video.loop = true;
            video.muted = true; // Necessário para autoplay funcionar em alguns navegadores
            video.playsInline = true; // Evita fullscreen nativo no iOS/Safari
            video.setAttribute('playsinline', '');
            video.setAttribute('controls', 'false');
            
            // Fallback para se o vídeo falhar (ex: codec não suportado)
            video.onerror = () => {
                console.error("Erro ao carregar vídeo");
                showError("Erro ao carregar vídeo. Verifique o link.");
            };

            // Adicionar um segundo source como fallback (opcional, mas recomendado)
            // Ex: Se o MP4 não funcionar, tenta WebM
            // const source1 = document.createElement('source');
            // source1.src = ASSETS.video;
            // source1.type = 'video/mp4';
            // video.appendChild(source1);

            displayArea.appendChild(video);

            // Forçar o início do vídeo (alguns navegadores bloqueiam autoplay inicial)
            video.play().catch(error => console.log("Autoplay bloqueado, tentando retry", error));
        }

        function renderPrice() {
            const img = document.createElement('img');
            img.src = ASSETS.price;
            img.alt = "Preçário";
            img.className = 'price-sheet';

            img.onerror = () => {
                showError("Erro ao carregar preçário.");
            };

            displayArea.appendChild(img);
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `<h1>⚠️ ${message}</h1><p>Tente recarregar a página.</p>`;
            displayArea.innerHTML = ''; // Limpa a área
            displayArea.appendChild(errorDiv);
        }

        // Inicializar
        initDisplay();

        // Re-renderizar se a orientação da TV mudar (ex: TV gira)
        window.addEventListener('resize', () => {
            // O CSS object-fit já trata disso, mas garantimos que o vídeo esteja tocando
            const video = document.querySelector('video');
            if (video && video.paused) {
                video.play();
            }
        });
    </script>
</body>
</html>
