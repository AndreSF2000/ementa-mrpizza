<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR. Pizza - TV Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: none;
        }

        .display-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            /* A cor será definida via JS na variável --bg-color */
            background-color: var(--bg-color, #000); 
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
            pointer-events: none;
        }

        img.price-sheet {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            background-color: transparent;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            transition: opacity 0.5s ease-out;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #fff;
            font-size: 2rem;
            text-align: center;
            padding: 2rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="display-container" id="displayArea">
        <div class="loading-overlay" id="loader">
            <div class="spinner"></div>
            <p>A carregar conteúdo...</p>
        </div>
    </div>

    <script>
        const ASSETS = {
            video: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menus-mr-ermesinde-out-2026.mp4",
            price: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menu-tv-fixo.png"
        };

        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') || 'video';
        
        // Cor de fundo: padrão preto (000000). Pode ser alterado via ?bg=RRGGBB
        const bgColor = params.get('bg') || '000000'; 

        const displayArea = document.getElementById('displayArea');
        const loader = document.getElementById('loader');

        // Aplicar a cor de fundo personalizada
        document.documentElement.style.setProperty('--bg-color', `#${bgColor}`);

        function hideLoader() {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
        }

        function initDisplay() {
            if (mode === 'video') {
                renderVideo();
            } else if (mode === 'price') {
                renderPrice();
            } else {
                showError("Modo inválido. Use ?mode=video ou ?mode=price");
            }
        }

        function renderVideo() {
            const video = document.createElement('video');
            video.src = ASSETS.video;
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.playsInline = true;
            video.preload = 'auto';
            video.crossOrigin = 'anonymous';
            video.setAttribute('playsinline', '');
            video.setAttribute('controls', 'false');
            video.setAttribute('disableRemotePlayback', 'true');
            video.setAttribute('disablePictureInPicture', 'true');
            video.setAttribute('controlsList', 'nodownload noremoteplayback noplaybackrate');

            let stallCount = 0;
            const maxStallsBeforeReload = 3;

            video.addEventListener('stalled', () => {
                stallCount++;
                if (stallCount >= maxStallsBeforeReload) {
                    const currentTime = video.currentTime;
                    video.currentTime = Math.max(0, currentTime - 0.1);
                    video.play().catch(() => {});
                    stallCount = 0;
                }
            });

            video.addEventListener('timeupdate', () => {
                if (stallCount > 0) stallCount = 0;
            });

            video.onerror = () => {
                showError("Erro ao carregar vídeo. Verifique a internet.");
            };

            displayArea.appendChild(video);
            video.addEventListener('canplay', hideLoader);
            video.addEventListener('loadeddata', hideLoader);
            video.play().catch(error => {
                setTimeout(() => video.play().catch(e => console.error("Autoplay falhou", e)), 500);
            });
        }

        function renderPrice() {
            const img = document.createElement('img');
            img.src = ASSETS.price;
            img.alt = "Preçário MR. Pizza";
            img.className = 'price-sheet';
            img.crossOrigin = 'anonymous';

            img.onerror = () => {
                showError("Erro ao carregar preçário.");
            };

            img.onload = hideLoader;
            displayArea.appendChild(img);
        }

        function showError(message) {
            loader.innerHTML = `
                <div style="text-align: center;">
                    <h1 style="font-size: 3rem; margin-bottom: 1rem;">⚠️</h1>
                    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">${message}</h2>
                    <p style="font-size: 1rem; opacity: 0.7;">A tentar recarregar automaticamente em 10 segundos...</p>
                </div>
            `;
            loader.style.opacity = '1';
            loader.style.display = 'flex';
            setTimeout(() => window.location.reload(), 10000);
        }

        initDisplay();

        window.addEventListener('resize', () => {
            const video = document.querySelector('video');
            if (video && video.paused) video.play().catch(() => {});
        });
    </script>
</body>
</html>
