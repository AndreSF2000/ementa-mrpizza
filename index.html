<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MR. Pizza - TV Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .display-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #000;
        }

        /* O SEGREDO: object-fit: contain + transform: scale() */
        /* O WebOS da LG lida melhor com contain + zoom do que com cover direto */
        video, img.price-sheet {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            background-color: #000;
            pointer-events: none;
            display: block;
            /* Zoom forçado para preencher a tela se a proporção for 16:9 */
            /* Ajuste este valor se precisar: 1.0 = normal, 1.5 = 50% maior */
            transform: scale(1);
            transition: transform 0.5s ease;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            transition: opacity 0.3s ease-out;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="display-container" id="displayArea">
        <div class="loading-overlay" id="loader">
            <div class="spinner"></div>
            <p>A carregar conteúdo...</p>
        </div>
    </div>

    <script>
        const ASSETS = {
            video: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menus-mr-ermesinde-out-2026.mp4",
            priceVideo: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/refs/heads/main/precario%20video.mp4",
            price: "https://raw.githubusercontent.com/AndreSF2000/ementa-mrpizza/main/menu-tv-fixo.png"
        };

        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') || 'video';

        const displayArea = document.getElementById('displayArea');
        const loader = document.getElementById('loader');

        function hideLoader() {
            if (loader && loader.parentNode) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    if (loader.parentNode) loader.remove();
                }, 300);
            }
        }

        function initDisplay() {
            if (mode === 'video') {
                renderVideo(ASSETS.video);
            } else if (mode === 'price') {
                renderVideo(ASSETS.priceVideo, true);
            } else {
                showError("Modo inválido. Use ?mode=video ou ?mode=price");
            }
        }

        function renderVideo(src, hasFallback = false) {
            const video = document.createElement('video');
            video.preload = 'auto';
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.playsInline = true;
            video.crossOrigin = 'anonymous';
            video.setAttribute('playsinline', '');
            video.setAttribute('controls', 'false');
            video.setAttribute('disableRemotePlayback', 'true');
            video.setAttribute('disablePictureInPicture', 'true');
            video.setAttribute('controlsList', 'nodownload noremoteplayback noplaybackrate');

            const source = document.createElement('source');
            source.src = src;
            source.type = 'video/mp4';
            video.appendChild(source);

            let stallCount = 0;
            const maxStallsBeforeReload = 3;
            let hasStarted = false;

            // Verificar se o vídeo está realmente a mostrar conteúdo (não preto)
            function checkVideoContent() {
                if (!hasStarted) return;
                
                // Se o vídeo estiver a tocar, mas o canvas estiver preto, há um problema
                // Para simplificar, vamos confiar no 'timeupdate'
                if (video.currentTime > 0.1 && video.videoWidth > 0) {
                    // Vídeo está a mostrar conteúdo
                    stallCount = 0;
                }
            }

            video.addEventListener('stalled', () => {
                stallCount++;
                if (stallCount >= maxStallsBeforeReload) {
                    console.log("Vídeo travou, a tentar recuperar");
                    const currentTime = video.currentTime;
                    video.currentTime = Math.max(0, currentTime - 0.1);
                    video.play().catch(() => {});
                    stallCount = 0;
                }
            });

            video.addEventListener('timeupdate', checkVideoContent);

            video.onerror = () => {
                console.error("Erro ao carregar vídeo:", src);
                if (hasFallback) {
                    renderStaticImage();
                } else {
                    showError("Erro ao carregar vídeo. Verifique a internet.");
                }
            };

            const onReady = () => {
                hideLoader();
                hasStarted = true;
                
                // Forçar o vídeo a recarregar os metadados (workaround para WebOS)
                video.load();
                video.play().catch(e => console.error("Autoplay falhou", e));
                
                video.removeEventListener('canplay', onReady);
                video.removeEventListener('loadeddata', onReady);
            };
            video.addEventListener('canplay', onReady);
            video.addEventListener('loadeddata', onReady);

            // Timeout de segurança
            const loadTimeout = setTimeout(() => {
                if (!hasStarted) {
                    console.error("Timeout: Vídeo não carregou em 10s");
                    if (hasFallback) {
                        renderStaticImage();
                    } else {
                        showError("Erro ao carregar vídeo. Verifique a internet.");
                    }
                }
            }, 10000);

            displayArea.appendChild(video);
            
            video.play().catch(error => {
                console.log("Autoplay inicial bloqueado, tentando novamente", error);
                setTimeout(() => video.play().catch(e => console.error("Autoplay falhou", e)), 500);
            });
        }

        function renderStaticImage() {
            const imgElement = document.createElement('img');
            imgElement.src = ASSETS.price;
            imgElement.alt = "Preçário MR. Pizza";
            imgElement.className = 'price-sheet';

            imgElement.onerror = () => {
                showError("Erro ao carregar preçário.");
            };

            imgElement.onload = hideLoader;
            displayArea.appendChild(imgElement);
        }

        function showError(message) {
            loader.innerHTML = `
                <div style="text-align: center;">
                    <h1 style="font-size: 3rem; margin-bottom: 1rem;">⚠️</h1>
                    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">${message}</h2>
                    <p style="font-size: 1rem; opacity: 0.7;">A tentar recarregar automaticamente em 10 segundos...</p>
                </div>
            `;
            loader.style.opacity = '1';
            loader.style.display = 'flex';
            setTimeout(() => window.location.reload(), 10000);
        }

        initDisplay();

        window.addEventListener('resize', () => {
            const video = document.querySelector('video');
            if (video && video.paused) video.play().catch(() => {});
        });
    </script>
</body>
</html>
