<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>MR. Pizza — Ecrãs TV</title>
<style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        position: fixed;
        inset: 0;
        cursor: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, sans-serif;
    }

    #ecra {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000;
    }

    /*
     * Palco: caixa com a proporção exata do conteúdo.
     * TV1 (?mode=video) enche o ecrã (cover); TV2 (?mode=price) é sempre
     * visível por inteiro (contain). As decorações vivem dentro do palco,
     * por isso ficam sempre alinhadas com a imagem/vídeo.
     */
    #palco {
        position: relative;
        flex: 0 0 auto;
        overflow: hidden;
        background: #000;
        transform: translateZ(0);
    }

    .media {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        image-rendering: auto;
        border: 0;
        outline: 0;
    }

    /* Camada 1 (TV2) — preçário original, sem perdas */
    #precario { object-fit: fill; }

    /* Camada 2 (TV2) — chef animado, com o verde removido */
    #logotipo {
        position: absolute;
        z-index: 2;
        aspect-ratio: 456 / 418;
        height: auto;
        pointer-events: none;
    }

    /* Reserva estática do chef */
    #logotipo-png {
        position: absolute;
        z-index: 2;
        pointer-events: none;
    }

    /* Vídeo-fonte do chef: fora do ecrã, mas a descodificar */
    #fonte-logotipo {
        position: absolute;
        left: -20px;
        top: -20px;
        width: 2px;
        height: 2px;
        opacity: .01;
        pointer-events: none;
        z-index: -1;
    }

    /* Camada 3 — decorações (Halloween, etc.) */
    .decoracao {
        position: absolute;
        z-index: 3;
        pointer-events: none;
    }

    /* Figuras vetoriais (abóbora, árvore, …) */
    .figura { width: 100%; }
    .figura svg {
        display: block;
        width: 100%;
        height: auto;
        /* sombra suave: as figuras claras continuam a ver-se sobre fundos claros */
        filter: drop-shadow(0 3px 7px rgba(0, 0, 0, .38));
    }

    /* Efeitos animados (neve, morcegos, …) ocupam o palco todo */
    .decoracao.efeito {
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .efeito-canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
    }

    .anim-flutuar { animation: flutuar 6s ease-in-out infinite; }
    @keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7%); } }

    .anim-balancar { transform-origin: 50% 100%; animation: balancar 5s ease-in-out infinite; }
    @keyframes balancar { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    .anim-pulsar { transform-origin: 50% 50%; animation: pulsar 3.4s ease-in-out infinite; }
    @keyframes pulsar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

    .anim-girar { transform-origin: 50% 50%; animation: girar 45s linear infinite; }

    .loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        color: #fff;
        font: 500 16px/1.3 system-ui, sans-serif;
        transition: opacity .3s linear;
    }

    .loading-overlay.oculto { opacity: 0; pointer-events: none; }

    .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid rgba(255, 255, 255, .25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: girar 1s linear infinite;
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    #aviso {
        position: fixed;
        left: 14px;
        bottom: 14px;
        z-index: 99;
        display: none;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, .72);
        color: #fff;
        font: 500 14px/1.3 system-ui, sans-serif;
    }

    /* Aviso de atualização */
    #aviso-atualizacao {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: .35em;
        background: rgba(0, 0, 0, .82);
        color: #fff;
        text-align: center;
        font: 600 clamp(22px, 2.4vw, 48px)/1.2 system-ui, sans-serif;
    }

    #aviso-atualizacao p { margin: 0; }

    #aviso-atualizacao #contagem {
        color: #4ade80;
        font-size: 1.7em;
        font-variant-numeric: tabular-nums;
    }
</style>
</head>
<body>

<div id="ecra">
    <div id="palco"></div>
</div>

<div class="loading-overlay" id="loader">
    <div class="spinner"></div>
    <p>A carregar conteúdo…</p>
</div>

<script src="efeitos.js"></script>
<script>
/* ------------------------------------------------------------------
   CONFIGURAÇÃO
   ------------------------------------------------------------------ */
const VERSAO = '2026-10-25b';

const ASSETS = {
    menus: 'menus-mr-ermesinde-out-2026.mp4',
    precario: 'menu-tv-fixo.png',
    logotipo: 'mrpizza.mp4',
    logotipoReserva: 'logotipo-chef.png',
    config: 'decoracoes.json',
    efeitos: 'efeitos.js',
    logotipoHalloween: [
        'halloween-vampire.mp4',
        'halloween-morph.mp4'
    ]
};

/* Recorte do chef dentro do vídeo (fundo verde) */
const CORTE = { x: 350, y: 146, l: 456, a: 418 };

/* Posição por omissão do chef, em percentagem do palco */
const CHEF_OMISSAO = { x: 6.6, y: 59, largura: 12 };

/* Atualizações automáticas */
const INTERVALO_VERIFICACAO = 20000;
const SEGUNDOS_AVISO = 5;

/* ------------------------------------------------------------------ */

const palco = document.getElementById('palco');
const loader = document.getElementById('loader');

let proporcao = 16 / 9;
let cobrirEcra = false;
let temporizadores = [];

/* Ecrã: ?mode=video (TV1, por omissão) ou ?mode=price (TV2) */
const MODO = (() => {
    const p = new URLSearchParams(location.search);
    const m = (p.get('mode') || p.get('ecra') || p.get('tv') || '').toLowerCase();
    if (['price', 'precario', 'preço', 'preco', '2', 'tv2'].includes(m)) return 'preco';
    return 'video';
})();

function comVersao(url) {
    return url + (url.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(VERSAO);
}

/*
 * Ajusta o palco ao conteúdo.
 * cobrir = true  → preenche o ecrã (pode cortar as bordas) — TV1
 * cobrir = false → cabe todo no ecrã (barras pretas se preciso) — TV2
 */
function ajustarPalco(ar, cobrir) {
    if (!ar || !isFinite(ar) || ar <= 0) ar = 16 / 9;
    proporcao = ar;
    cobrirEcra = !!cobrir;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let largura = vw;
    let altura = vw / ar;

    if (cobrir) {
        if (altura < vh) { altura = vh; largura = vh * ar; }
    } else {
        if (altura > vh) { altura = vh; largura = vh * ar; }
    }

    palco.style.width = Math.round(largura) + 'px';
    palco.style.height = Math.round(altura) + 'px';
}

function aviso(mensagem) {
    let el = document.getElementById('aviso');
    if (!el) {
        el = document.createElement('div');
        el.id = 'aviso';
        document.body.appendChild(el);
    }
    el.textContent = mensagem;
    el.style.display = 'block';
}

function limparAviso() {
    const el = document.getElementById('aviso');
    if (el) el.remove();
}

function esconderLoader() {
    if (!loader || !loader.parentNode) return;
    loader.classList.add('oculto');
    const id = setTimeout(() => { if (loader.parentNode) loader.remove(); }, 400);
    temporizadores.push(id);
}

function tocar(video) {
    const p = video.play();
    if (p && p.catch) {
        p.catch(() => {
            const id = setTimeout(() => video.play().catch(() => {}), 1500);
            temporizadores.push(id);
        });
    }
}

/* Se o vídeo congelar, recarrega sozinho */
function vigiarVideo(video) {
    let ultimoTempo = -1;
    let parado = 0;

    const id = setInterval(() => {
        if (document.hidden) return;
        if (video.paused) { tocar(video); return; }
        if (video.readyState < 3) return;

        if (video.currentTime === ultimoTempo) {
            if (++parado >= 2) {
                parado = 0;
                video.load();
                tocar(video);
            }
        } else {
            parado = 0;
            ultimoTempo = video.currentTime;
        }
    }, 3000);

    temporizadores.push(id);
}

/* ------------------------------------------------------------------
   Decorações (Halloween, Natal, etc.) vêm de decoracoes.json
   ------------------------------------------------------------------ */
let cfg = { versao: '', chef: CHEF_OMISSAO, decoracoes: [] };

async function carregarConfig() {
    try {
        const resposta = await fetch(ASSETS.config + '?t=' + Date.now(), { cache: 'no-store' });
        if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
        const dados = await resposta.json();
        cfg = {
            versao: dados.versao || '',
            chef: Object.assign({}, CHEF_OMISSAO, dados.chef || {}),
            decoracoes: Array.isArray(dados.decoracoes) ? dados.decoracoes : []
        };
    } catch (e) {
        cfg = { versao: '', chef: CHEF_OMISSAO, decoracoes: [] };
    }
}

/* Efeitos que reagem às mudanças de slide do vídeo dos menus */
const efeitosSincronizados = [];

function desenharDecoracoes() {
    const alvo = MODO === 'video' ? 'video' : 'preco';

    cfg.decoracoes.forEach((d) => {
        if (Array.isArray(d.ecras) && d.ecras.length && !d.ecras.includes(alvo)) return;

        /* Efeito animado (neve, morcegos, fogos…) */
        if (d.tipo === 'efeito') {
            if (!d.efeito || typeof iniciarEfeito !== 'function') return;
            const caixa = document.createElement('div');
            caixa.className = 'decoracao efeito';
            if (d.opacidade != null) caixa.style.opacity = d.opacidade;
            palco.appendChild(caixa);
            try {
                const efeito = iniciarEfeito(d.efeito, caixa);
                if (d.sincronizar !== false) efeitosSincronizados.push(efeito);
            } catch (e) {
                caixa.remove();
            }
            return;
        }

        /* Figura vetorial (abóbora, árvore, estrela…) */
        if (d.tipo === 'figura') {
            const html = typeof svgFigura === 'function' ? svgFigura(d.figura, d.cor) : '';
            if (!html) return;

            const caixa = document.createElement('div');
            caixa.className = 'decoracao';
            caixa.style.left = (d.x ?? 0) + '%';
            caixa.style.top = (d.y ?? 0) + '%';
            caixa.style.width = (d.largura ?? 10) + '%';
            if (d.opacidade != null) caixa.style.opacity = d.opacidade;
            if (d.rotacao) caixa.style.transform = 'rotate(' + d.rotacao + 'deg)';

            const dentro = document.createElement('div');
            dentro.className = 'figura' + (d.anim ? ' anim-' + d.anim : '');
            dentro.innerHTML = html;

            caixa.appendChild(dentro);
            palco.appendChild(caixa);
            return;
        }

        /* Imagem enviada pelo editor */
        if (!d.ficheiro) return;

        const img = document.createElement('img');
        img.className = 'decoracao';
        img.alt = '';
        img.style.left = (d.x ?? 0) + '%';
        img.style.top = (d.y ?? 0) + '%';
        img.style.width = (d.largura ?? 15) + '%';
        if (d.rotacao) img.style.transform = 'rotate(' + d.rotacao + 'deg)';
        if (d.anim) img.classList.add('anim-' + d.anim);
        if (d.opacidade != null) img.style.opacity = d.opacidade;

        const versao = encodeURIComponent(cfg.versao || '1');
        img.src = d.ficheiro + (d.ficheiro.includes('?') ? '&' : '?') + 'v=' + versao;

        palco.appendChild(img);
    });
}

/*
 * Deteta quando o vídeo dos menus muda de slide (a imagem muda de repente)
 * e avisa os efeitos para darem uma rajada nesse momento.
 */
function vigiarDeslizes(video) {
    const lona = document.createElement('canvas');
    lona.width = 48;
    lona.height = 27;
    const ctx = lona.getContext('2d', { willReadFrequently: true });

    let anterior = null;
    let ultimaLeitura = 0;
    let ultimoAviso = 0;

    const id = setInterval(() => {
        if (document.hidden || video.readyState < 2 || video.paused) return;

        const agora = performance.now();
        if (agora - ultimaLeitura < 400) return;
        ultimaLeitura = agora;

        try {
            ctx.drawImage(video, 0, 0, 48, 27);
        } catch (e) {
            return;
        }

        const dados = ctx.getImageData(0, 0, 48, 27).data;

        if (anterior) {
            let soma = 0;
            for (let i = 0; i < dados.length; i += 4) {
                soma += Math.abs(dados[i] - anterior[i])
                    + Math.abs(dados[i + 1] - anterior[i + 1])
                    + Math.abs(dados[i + 2] - anterior[i + 2]);
            }
            const media = soma / (48 * 27 * 3);

            if (media > 18 && agora - ultimoAviso > 1500) {
                ultimoAviso = agora;
                efeitosSincronizados.forEach((e) => { try { e.rajada(); } catch (x) {} });
            }
        }

        anterior = dados;
    }, 450);

    temporizadores.push(id);
}

/* ------------------------------------------------------------------
   TV1 — vídeo dos menus
   ------------------------------------------------------------------ */
function ecraVideo() {
    const video = document.createElement('video');
    video.id = 'video-menus';
    video.className = 'media';
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('muted', '');
    video.preload = 'auto';
    video.disablePictureInPicture = true;
    video.src = comVersao(ASSETS.menus);

    let emFalha = false;

    video.addEventListener('loadedmetadata', () => {
        ajustarPalco(video.videoWidth / video.videoHeight, true);
    });

    video.addEventListener('playing', () => {
        esconderLoader();
        limparAviso();
    });

    const falhar = () => {
        if (emFalha) return;
        emFalha = true;
        aviso('Vídeo da ementa sem ligação — a tentar novamente…');
        const id = setTimeout(() => {
            emFalha = false;
            video.load();
            tocar(video);
        }, 5000);
        temporizadores.push(id);
    };

    video.addEventListener('error', falhar);

    const limite = setTimeout(() => { if (video.readyState < 2) falhar(); }, 12000);
    temporizadores.push(limite);

    palco.appendChild(video);
    tocar(video);
    vigiarVideo(video);
    vigiarDeslizes(video);
}

/* ------------------------------------------------------------------
   TV2 — preçário (foto original + chef animado por cima)
   ------------------------------------------------------------------ */
function ecraPreco() {
    const img = new Image();
    img.id = 'precario';
    img.className = 'media';
    img.alt = 'Preçário Mr. Pizza';
    img.decoding = 'async';

    const carregar = () => { img.src = comVersao(ASSETS.precario); };

    img.addEventListener('load', async () => {
        ajustarPalco(img.naturalWidth / img.naturalHeight, false);
        palco.appendChild(img);
        try { await img.decode(); } catch (e) {}

        limparAviso();
        esconderLoader();
        iniciarChef();
    });

    img.addEventListener('error', () => {
        aviso('Preçário sem ligação — a tentar novamente…');
        const id = setTimeout(carregar, 4000);
        temporizadores.push(id);
    });

    carregar();
}

function iniciarChef() {
    const fonte = document.createElement('video');
    fonte.id = 'fonte-logotipo';
    fonte.muted = true;
    fonte.defaultMuted = true;
    fonte.loop = true;
    fonte.autoplay = true;
    fonte.playsInline = true;
    fonte.setAttribute('playsinline', '');
    fonte.setAttribute('muted', '');
    fonte.preload = 'auto';

    // Se houver logos de Halloween configurados, usar em sequência
    if (Array.isArray(ASSETS.logotipoHalloween) && ASSETS.logotipoHalloween.length > 0) {
        let idx = 0;
        fonte.src = comVersao(ASSETS.logotipoHalloween[idx]);
        fonte.addEventListener('ended', () => {
            idx = (idx + 1) % ASSETS.logotipoHalloween.length;
            fonte.src = comVersao(ASSETS.logotipoHalloween[idx]);
            fonte.play().catch(() => {});
        });
    } else {
        fonte.src = comVersao(ASSETS.logotipo);
    }

    document.body.appendChild(fonte);
    fonte.play().catch(() => {});

    const canvas = document.createElement('canvas');
    canvas.id = 'logotipo';
    canvas.width = CORTE.l;
    canvas.height = CORTE.a;
    canvas.style.left = cfg.chef.x + '%';
    canvas.style.top = cfg.chef.y + '%';
    canvas.style.width = cfg.chef.largura + '%';
    palco.appendChild(canvas);

    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let ultimoTempo = -1;
    let ultimoPintado = 0;
    let arrancou = false;

    function desenhar() {
        requestAnimationFrame(desenhar);

        if (document.hidden || fonte.readyState < 2) return;
        if (fonte.currentTime === ultimoTempo) return;

        const agora = performance.now();
        if (agora - ultimoPintado < 66) return;   // ~15 fps
        ultimoPintado = agora;
        ultimoTempo = fonte.currentTime;

        ctx.clearRect(0, 0, CORTE.l, CORTE.a);
        ctx.drawImage(fonte, CORTE.x, CORTE.y, CORTE.l, CORTE.a, 0, 0, CORTE.l, CORTE.a);

        const img = ctx.getImageData(0, 0, CORTE.l, CORTE.a);
        const d = img.data;

        for (let i = 0; i < d.length; i += 4) {
            const r = d[i], g = d[i + 1], b = d[i + 2];
            const verde = g - (r > b ? r : b);

            if (verde > 45) { d[i + 3] = 0; continue; }
            if (verde > 20) d[i + 3] = (255 * (45 - verde) / 25) | 0;

            const alvo = (r + b) / 2;
            if (g > alvo) d[i + 1] = alvo | 0;
        }

        ctx.putImageData(img, 0, 0);
        arrancou = true;
    }

    desenhar();

    // Se o vídeo não arrancar em 8 s, mostra o recorte estático
    const limite = setTimeout(() => {
        if (arrancou || fonte.readyState >= 2) return;
        const reserva = document.createElement('img');
        reserva.id = 'logotipo-png';
        reserva.alt = '';
        reserva.style.left = cfg.chef.x + '%';
        reserva.style.top = cfg.chef.y + '%';
        reserva.style.width = cfg.chef.largura + '%';
        reserva.src = comVersao(ASSETS.logotipoReserva);
        reserva.addEventListener('error', () => reserva.remove());
        palco.appendChild(reserva);
    }, 8000);
    temporizadores.push(limite);
}

/* ------------------------------------------------------------------
   Arranque
   ------------------------------------------------------------------ */
async function arrancar() {
    await carregarConfig();
    ajustarPalco(16 / 9, MODO === 'video');

    if (MODO === 'preco') {
        ecraPreco();
    } else {
        ecraVideo();
    }

    desenharDecoracoes();
    iniciarVerificacaoAtualizacoes();
    manterAtivo();
}

/* ------------------------------------------------------------------
   MANTER TV ATIVA (anti-standby)
   ------------------------------------------------------------------ */
async function manterAtivo() {
    try {
        if ('wakeLock' in navigator) {
            await navigator.wakeLock.request('screen');
        }
    } catch (e) {}
}

manterAtivo();
setInterval(manterAtivo, 60000);

setInterval(() => {
    try {
        window.dispatchEvent(new Event('mousemove'));
        window.dispatchEvent(new Event('touchstart'));
    } catch (e) {}
}, 120000);

function iniciarAudioSilencioso() {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        gain.gain.value = 0.0001;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
    } catch (e) {}
}

document.addEventListener('click', iniciarAudioSilencioso, { once: true });
document.addEventListener('touchstart', iniciarAudioSilencioso, { once: true });
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) manterAtivo();
});

/* ------------------------------------------------------------------
   FORÇAR ATUALIZAÇÃO REMOTA
   ------------------------------------------------------------------ */
let versaoForcadaAtual = localStorage.getItem('mrpizza_forcar_v') || '0';
const URL_FORCAR = './forcar.json';

async function verificarForcar() {
    try {
        const res = await fetch(URL_FORCAR + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        const nova = String(data.versao || 0);
        if (versaoForcadaAtual === '0') {
            versaoForcadaAtual = nova;
            localStorage.setItem('mrpizza_forcar_v', nova);
            return;
        }
        if (nova !== versaoForcadaAtual) {
            localStorage.setItem('mrpizza_forcar_v', nova);
            setTimeout(() => location.reload(), 300);
        }
    } catch (e) {}
}

setInterval(verificarForcar, 10000);
verificarForcar();

window.addEventListener('resize', () => ajustarPalco(proporcao, cobrirEcra));
window.addEventListener('DOMContentLoaded', arrancar);

/* Ecrã cheio com um clique no telecomando */
document.addEventListener('click', async () => {
    if (!document.fullscreenElement) {
        try {
            await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
        } catch (e) {}
    }
    const video = palco.querySelector('video.media');
    if (video && video.paused) tocar(video);
});

/* Evita que o ecrã suspenda */
async function manterAcordado() {
    try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
    } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) manterAcordado();
});
manterAcordado();

/* ------------------------------------------------------------------
   Atualizações automáticas
   Compara o Last-Modified do HTML e do decoracoes.json. Se mudarem,
   avisa 5 s e recarrega.
   ------------------------------------------------------------------ */
let marcaServidor = null;
let aAtualizar = false;

async function marcaDe(url) {
    try {
        const resposta = await fetch(url + (url.includes('?') ? '&' : '?') + 'ver=' + Date.now(), {
            method: 'HEAD',
            cache: 'no-store'
        });
        if (!resposta.ok) return null;
        return resposta.headers.get('last-modified') || resposta.headers.get('etag') || '';
    } catch (e) {
        return null;
    }
}

async function marcaAtual() {
    const [html, config, efeitos] = await Promise.all([
        marcaDe(location.pathname),
        marcaDe(ASSETS.config),
        marcaDe(ASSETS.efeitos)
    ]);
    if (!html && !config && !efeitos) return null;
    return (html || '') + '|' + (config || '') + '|' + (efeitos || '');
}

function avisarAtualizacao() {
    if (aAtualizar) return;
    aAtualizar = true;

    const caixa = document.createElement('div');
    caixa.id = 'aviso-atualizacao';
    caixa.innerHTML = '<p>A atualizar…</p><p id="contagem">' + SEGUNDOS_AVISO + '</p>';
    document.body.appendChild(caixa);

    let restantes = SEGUNDOS_AVISO;
    const contador = setInterval(() => {
        restantes--;
        const numero = document.getElementById('contagem');
        if (numero) numero.textContent = restantes > 0 ? restantes : '…';
        if (restantes <= 0) {
            clearInterval(contador);
            location.reload();
        }
    }, 1000);
}

async function verificarAtualizacao() {
    if (aAtualizar) return;
    const marca = await marcaAtual();
    if (!marca) return;
    if (marcaServidor === null) { marcaServidor = marca; return; }
    if (marca !== marcaServidor) avisarAtualizacao();
}

function iniciarVerificacaoAtualizacoes() {
    marcaAtual().then((m) => { marcaServidor = m; });
    setInterval(verificarAtualizacao, INTERVALO_VERIFICACAO);
}
