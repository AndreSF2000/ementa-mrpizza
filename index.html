<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>MR. Pizza — Ecrãs TV</title>
<style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        position: fixed;
        inset: 0;
        cursor: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, sans-serif;
    }

    #ecra {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000;
    }

    /*
     * Palco: caixa com a proporção exata do conteúdo.
     * TV1 (?mode=video) enche o ecrã (cover); TV2 (?mode=price) é sempre
     * visível por inteiro (contain). As decorações vivem dentro do palco,
     * por isso ficam sempre alinhadas com a imagem/vídeo.
     */
    #palco {
        position: relative;
        flex: 0 0 auto;
        overflow: hidden;
        background: #000;
        transform: translateZ(0);
    }

    .media {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        image-rendering: auto;
        border: 0;
        outline: 0;
    }

    /* Camada 1 (TV2) — preçário original, sem perdas */
    #precario { object-fit: fill; }

    /* Camada 2 (TV2) — logo original + animações
       Fica por cima das decorações: é a logo da casa, não pode ficar
       tapada pelas figuras das épocas. */
    #logotipo {
        position: absolute;
        z-index: 4;
        height: auto;
        pointer-events: none;
    }

    .leitor-logo { position: relative; width: 100%; height: 100%; }

    /* A logo original balança devagar, como no vídeo do chef */
    .logo-a-vivo {
        transform-origin: 50% 88%;
        animation: logoRespira 11s ease-in-out infinite;
    }

    @keyframes logoRespira {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-1.2%) rotate(2deg); }
    }

    .leitor-logo .logo-original,
    .leitor-logo .clipe-logo {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        transform: translateZ(0);
        will-change: opacity;
    }

    /*
     * Camada anti-standby (TV2) — vai ACIMA de tudo, dentro do #ecra.
     *
     * A TV dos menus nunca entra em suspensão porque tem um vídeo H.264 em
     * ecrã inteiro a tocar; a dos preços passa a ter as mesmas condições:
     * vigia.mp4 é H.264, 1920x1080, 30 fps, sem som, em ciclo.
     *
     * ATENÇÃO — a TV desenha o vídeo numa camada própria e ignora o CSS
     * (opacidade e «mix-blend-mode»). Com a camada a 100% e uma soma de
     * cores que a TV não faz, o filme preto ficou POR CIMA de tudo e o
     * ecrã ficou preto. Por isso: 2% de opacidade, sem somas de cor, e
     * desligada por omissão — liga-se com ?vigia=1 para testar.
     *
     * Com 2% nem se nota o preto (medido: no máximo 2% mais escuro num
     * ponto), mas a TV vê um vídeo a tocar por cima de todas as camadas.
     */
    #vigia {
        position: absolute;
        inset: 0;
        z-index: 50;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: .02;
        pointer-events: none;
        transform: translateZ(0);
    }

    /* Camada 3 — decorações (Halloween, etc.) */
    .decoracao {
        position: absolute;
        z-index: 3;
        pointer-events: none;
    }

    /* Figuras vetoriais (abóbora, árvore, …) */
    .figura { width: 100%; }
    .figura svg {
        display: block;
        width: 100%;
        height: auto;
        /* sombra suave: as figuras claras continuam a ver-se sobre fundos claros */
        filter: drop-shadow(0 3px 7px rgba(0, 0, 0, .38));
    }

    /* Efeitos animados (neve, morcegos, …) ocupam o palco todo */
    .decoracao.efeito {
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .efeito-canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
    }

    .anim-flutuar { animation: flutuar 6s ease-in-out infinite; }
    @keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7%); } }

    .anim-balancar { transform-origin: 50% 100%; animation: balancar 5s ease-in-out infinite; }
    @keyframes balancar { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    .anim-pulsar { transform-origin: 50% 50%; animation: pulsar 3.4s ease-in-out infinite; }
    @keyframes pulsar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

    .anim-girar { transform-origin: 50% 50%; animation: girar 45s linear infinite; }

    .loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        color: #fff;
        font: 500 16px/1.3 system-ui, sans-serif;
        transition: opacity .3s linear;
    }

    .loading-overlay.oculto { opacity: 0; pointer-events: none; }

    .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid rgba(255, 255, 255, .25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: girar 1s linear infinite;
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    #aviso {
        position: fixed;
        left: 14px;
        bottom: 14px;
        z-index: 99;
        display: none;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, .72);
        color: #fff;
        font: 500 14px/1.3 system-ui, sans-serif;
    }

    /* Diagnóstico escondido (tecla 0 do telecomando ou ?diag=1) */
    #diagnostico {
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 1000;
        display: none;
        margin: 0;
        padding: 10px 12px;
        max-width: 92vw;
        max-height: 94vh;
        overflow: hidden;
        border-radius: 8px;
        background: rgba(0, 0, 0, .88);
        color: #9ef0a8;
        font: 500 clamp(12px, 1.55vh, 22px)/1.45 ui-monospace, monospace;
        white-space: pre-wrap;
        pointer-events: none;
    }

    /* Dica para entrar em ecrã cheio (desaparece sozinha) */
    #dica-ecran {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 900;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(0, 0, 0, .72);
        border: 1px solid rgba(255, 255, 255, .18);
        color: #fff;
        font: 500 clamp(12px, 1.5vh, 20px)/1.2 system-ui, sans-serif;
        pointer-events: none;
    }

    /* Aviso de atualização */
    #aviso-atualizacao {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: .35em;
        background: rgba(0, 0, 0, .82);
        color: #fff;
        text-align: center;
        font: 600 clamp(22px, 2.4vw, 48px)/1.2 system-ui, sans-serif;
    }

    #aviso-atualizacao p { margin: 0; }

    #aviso-atualizacao #contagem {
        color: #4ade80;
        font-size: 1.7em;
        font-variant-numeric: tabular-nums;
    }
</style>
</head>
<body>

<div id="ecra">
    <div id="palco"></div>
</div>

<div class="loading-overlay" id="loader">
    <div class="spinner"></div>
    <p>A carregar conteúdo…</p>
</div>

<script src="efeitos.js"></script>
<script src="animacoes.js"></script>
<script>
/* ------------------------------------------------------------------
   CONFIGURAÇÃO
   ------------------------------------------------------------------ */
const VERSAO = '2026-10-27a';

/* Desde quando o ecrã está ligado nesta página e quantas vezes foi preciso
   voltar a arrancar a camada anti-standby. Serve para responder à única
   pergunta que importa no restaurante: «há quanto tempo está a aguentar?» */
const ARRANQUE = Date.now();
let recomecosVigia = 0;

/* Registo do que o leitor de animações vai fazendo (serve ao diagnóstico) */
window.__animLog = [];
window.__animFallback = false;

/*
 * Registo ao vivo para a TV.
 *
 * Uma TV não tem consola acessível: se algo falha, não há como ver. Isto
 * guarda as últimas mensagens (erros do site, animações, rede) e mostra-as
 * na caixa do diagnóstico, para se poder ler — ou fotografar — no próprio
 * ecrã.
 */
window.__logs = [];

function registarLog(nivel, texto) {
    const l = window.__logs;
    l.push({ t: Math.round(performance.now()), nivel: nivel, texto: String(texto) });
    if (l.length > 60) l.shift();
    return l;
}

window.addEventListener('error', (e) => {
    const ficheiro = String(e.filename || '').split('/').pop();
    registarLog('ERRO', (e.message || 'erro') + (ficheiro ? ' · ' + ficheiro + ':' + e.lineno : ''));
});

window.addEventListener('unhandledrejection', (e) => {
    const r = e.reason;
    registarLog('ERRO', 'promessa: ' + ((r && (r.message || r.name)) || r));
});

/* Os erros que o site escreve na consola também passam para aqui */
const erroDeConsola = console.error.bind(console);
console.error = function () {
    try { registarLog('ERRO', [...arguments].map(String).join(' ')); } catch (e) {}
    erroDeConsola.apply(null, arguments);
};

/* Versões para o diagnóstico e para a verificação de atualizações */
let versaoCarregada = '';
let versaoServidorVista = '';

const ASSETS = {
    menus: 'menus-mr-ermesinde-out-2026.mp4',
    precario: 'menu-tv-fixo.png',
    logotipoReserva: 'logotipo-chef.png',
    logotipoAnimado: 'logotipo-animado.webm',
    vigia: 'vigia.mp4',
    config: 'decoracoes.json',
    animacoes: 'animacoes.json',
    efeitos: 'efeitos.js'
};

/* Posição por omissão do chef, em percentagem do palco */
const CHEF_OMISSAO = { x: 6.6, y: 59, largura: 12 };

/* Atualizações automáticas */
const INTERVALO_VERIFICACAO = 30000;
const SEGUNDOS_AVISO = 5;

/* ------------------------------------------------------------------ */

const palco = document.getElementById('palco');
const loader = document.getElementById('loader');

let proporcao = 16 / 9;
let cobrirEcra = false;
let temporizadores = [];

/* Ecrã: ?mode=video (TV1, por omissão) ou ?mode=price (TV2) */
const MODO = (() => {
    const p = new URLSearchParams(location.search);
    const m = (p.get('mode') || p.get('ecra') || p.get('tv') || '').toLowerCase();
    if (['price', 'precario', 'preço', 'preco', '2', 'tv2'].includes(m)) return 'preco';
    return 'video';
})();

function comVersao(url) {
    return url + (url.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(VERSAO);
}

/*
 * Ajusta o palco ao conteúdo.
 * cobrir = true  → preenche o ecrã (pode cortar as bordas) — TV1
 * cobrir = false → cabe todo no ecrã (barras pretas se preciso) — TV2
 */
function ajustarPalco(ar, cobrir) {
    if (!ar || !isFinite(ar) || ar <= 0) ar = 16 / 9;
    proporcao = ar;
    cobrirEcra = !!cobrir;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let largura = vw;
    let altura = vw / ar;

    if (cobrir) {
        if (altura < vh) { altura = vh; largura = vh * ar; }
    } else {
        if (altura > vh) { altura = vh; largura = vh * ar; }
    }

    palco.style.width = Math.round(largura) + 'px';
    palco.style.height = Math.round(altura) + 'px';
}

function aviso(mensagem) {
    let el = document.getElementById('aviso');
    if (!el) {
        el = document.createElement('div');
        el.id = 'aviso';
        document.body.appendChild(el);
    }
    el.textContent = mensagem;
    el.style.display = 'block';
}

function limparAviso() {
    const el = document.getElementById('aviso');
    if (el) el.remove();
}

function esconderLoader() {
    if (!loader || !loader.parentNode) return;
    loader.classList.add('oculto');
    const id = setTimeout(() => { if (loader.parentNode) loader.remove(); }, 400);
    temporizadores.push(id);
}

function tocar(video) {
    const p = video.play();
    if (p && p.catch) {
        p.catch(() => {
            const id = setTimeout(() => video.play().catch(() => {}), 1500);
            temporizadores.push(id);
        });
    }
}

/* Se o vídeo congelar, recarrega sozinho */
function vigiarVideo(video) {
    let ultimoTempo = -1;
    let parado = 0;

    const contar = () => { if (video.id === 'vigia') recomecosVigia++; };

    const id = setInterval(() => {
        if (document.hidden) return;
        if (video.paused) { contar(); tocar(video); return; }
        if (video.readyState < 3) return;

        if (video.currentTime === ultimoTempo) {
            if (++parado >= 2) {
                parado = 0;
                contar();
                video.load();
                tocar(video);
            }
        } else {
            parado = 0;
            ultimoTempo = video.currentTime;
        }
    }, 3000);

    temporizadores.push(id);
}

/* ------------------------------------------------------------------
   Decorações (Halloween, Natal, etc.) vêm de decoracoes.json
   ------------------------------------------------------------------ */
let cfg = { versao: '', chef: CHEF_OMISSAO, decoracoes: [] };

/* Animações da logo (ordem e transições vêm de animacoes.json) */
let cfgAnim = {
    versao: '',
    proporcao: 0.973,
    transicao: { duracao: .6, logoInicial: 2.4, esperaLogo: 4, voltarLogo: true },
    clips: []
};
let leitorLogo = null;

async function carregarConfig() {
    try {
        const resposta = await fetch(ASSETS.config + '?t=' + Date.now(), { cache: 'no-store' });
        if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
        const dados = await resposta.json();
        cfg = {
            versao: dados.versao || '',
            chef: Object.assign({}, CHEF_OMISSAO, dados.chef || {}),
            decoracoes: Array.isArray(dados.decoracoes) ? dados.decoracoes : []
        };
    } catch (e) {
        cfg = { versao: '', chef: CHEF_OMISSAO, decoracoes: [] };
    }
}

async function carregarAnimacoes() {
    try {
        const resposta = await fetch(ASSETS.animacoes + '?t=' + Date.now(), { cache: 'no-store' });
        if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
        const dados = await resposta.json();
        cfgAnim = {
            versao: dados.versao || '',
            proporcao: Number(dados.proporcao) || .973,
            transicao: Object.assign({ duracao: .6, logoInicial: 2.4, esperaLogo: 4, voltarLogo: true }, dados.transicao || {}),
            clips: Array.isArray(dados.clips) ? dados.clips : []
        };
    } catch (e) {
        cfgAnim = { versao: '', proporcao: .973, transicao: { duracao: .6, logoInicial: 2.4, esperaLogo: 4, voltarLogo: true }, clips: [] };
    }
}

/* Efeitos que reagem às mudanças de slide do vídeo dos menus */
const efeitosSincronizados = [];

function desenharDecoracoes() {
    const alvo = MODO === 'video' ? 'video' : 'preco';

    cfg.decoracoes.forEach((d) => {
        if (Array.isArray(d.ecras) && d.ecras.length && !d.ecras.includes(alvo)) return;

        /* Efeito animado (neve, morcegos, fogos…) */
        if (d.tipo === 'efeito') {
            if (!d.efeito || typeof iniciarEfeito !== 'function') return;
            const caixa = document.createElement('div');
            caixa.className = 'decoracao efeito';
            if (d.opacidade != null) caixa.style.opacity = d.opacidade;
            palco.appendChild(caixa);
            try {
                const efeito = iniciarEfeito(d.efeito, caixa);
                if (d.sincronizar !== false) efeitosSincronizados.push(efeito);
            } catch (e) {
                caixa.remove();
            }
            return;
        }

        /* Figura vetorial (abóbora, árvore, estrela…) */
        if (d.tipo === 'figura') {
            const html = typeof svgFigura === 'function' ? svgFigura(d.figura, d.cor) : '';
            if (!html) return;

            const caixa = document.createElement('div');
            caixa.className = 'decoracao';
            caixa.style.left = (d.x ?? 0) + '%';
            caixa.style.top = (d.y ?? 0) + '%';
            caixa.style.width = (d.largura ?? 10) + '%';
            if (d.opacidade != null) caixa.style.opacity = d.opacidade;
            if (d.rotacao) caixa.style.transform = 'rotate(' + d.rotacao + 'deg)';

            const dentro = document.createElement('div');
            dentro.className = 'figura' + (d.anim ? ' anim-' + d.anim : '');
            dentro.innerHTML = html;

            caixa.appendChild(dentro);
            palco.appendChild(caixa);
            return;
        }

        /* Imagem enviada pelo editor */
        if (!d.ficheiro) return;

        const img = document.createElement('img');
        img.className = 'decoracao';
        img.alt = '';
        img.style.left = (d.x ?? 0) + '%';
        img.style.top = (d.y ?? 0) + '%';
        img.style.width = (d.largura ?? 15) + '%';
        if (d.rotacao) img.style.transform = 'rotate(' + d.rotacao + 'deg)';
        if (d.anim) img.classList.add('anim-' + d.anim);
        if (d.opacidade != null) img.style.opacity = d.opacidade;

        const versao = encodeURIComponent(cfg.versao || '1');
        img.src = d.ficheiro + (d.ficheiro.includes('?') ? '&' : '?') + 'v=' + versao;

        palco.appendChild(img);
    });
}

/*
 * Deteta quando o vídeo dos menus muda de slide (a imagem muda de repente)
 * e avisa os efeitos para darem uma rajada nesse momento.
 */
function vigiarDeslizes(video) {
    const lona = document.createElement('canvas');
    lona.width = 48;
    lona.height = 27;
    const ctx = lona.getContext('2d', { willReadFrequently: true });

    let anterior = null;
    let ultimaLeitura = 0;
    let ultimoAviso = 0;

    const id = setInterval(() => {
        if (document.hidden || video.readyState < 2 || video.paused) return;

        const agora = performance.now();
        if (agora - ultimaLeitura < 400) return;
        ultimaLeitura = agora;

        try {
            ctx.drawImage(video, 0, 0, 48, 27);
        } catch (e) {
            return;
        }

        const dados = ctx.getImageData(0, 0, 48, 27).data;

        if (anterior) {
            let soma = 0;
            for (let i = 0; i < dados.length; i += 4) {
                soma += Math.abs(dados[i] - anterior[i])
                    + Math.abs(dados[i + 1] - anterior[i + 1])
                    + Math.abs(dados[i + 2] - anterior[i + 2]);
            }
            const media = soma / (48 * 27 * 3);

            if (media > 18 && agora - ultimoAviso > 1500) {
                ultimoAviso = agora;
                efeitosSincronizados.forEach((e) => { try { e.rajada(); } catch (x) {} });
            }
        }

        anterior = dados;
    }, 450);

    temporizadores.push(id);
}

/* ------------------------------------------------------------------
   TV1 — vídeo dos menus
   ------------------------------------------------------------------ */
function ecraVideo() {
    const video = document.createElement('video');
    video.id = 'video-menus';
    video.className = 'media';
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('muted', '');
    video.preload = 'auto';
    video.disablePictureInPicture = true;
    video.src = comVersao(ASSETS.menus);

    let emFalha = false;

    video.addEventListener('loadedmetadata', () => {
        ajustarPalco(video.videoWidth / video.videoHeight, true);
    });

    video.addEventListener('playing', () => {
        esconderLoader();
        limparAviso();
    });

    const falhar = () => {
        if (emFalha) return;
        emFalha = true;
        aviso('Vídeo da ementa sem ligação — a tentar novamente…');
        const id = setTimeout(() => {
            emFalha = false;
            video.load();
            tocar(video);
        }, 5000);
        temporizadores.push(id);
    };

    video.addEventListener('error', falhar);

    const limite = setTimeout(() => { if (video.readyState < 2) falhar(); }, 12000);
    temporizadores.push(limite);

    palco.appendChild(video);
    tocar(video);
    vigiarVideo(video);
    vigiarDeslizes(video);
}

/* ------------------------------------------------------------------
   TV2 — preçário (foto original + chef animado por cima)
   ------------------------------------------------------------------ */
function ecraPreco() {
    const img = new Image();
    img.id = 'precario';
    img.className = 'media';
    img.alt = 'Preçário Mr. Pizza';
    img.decoding = 'async';

    const carregar = () => { img.src = comVersao(ASSETS.precario); };

    img.addEventListener('load', async () => {
        ajustarPalco(img.naturalWidth / img.naturalHeight, false);
        palco.appendChild(img);

        // O decode() pode nunca resolver (browser de TV, poupança de energia).
        // Não vale a pena ficar à espera dele para arrancar a logo.
        try {
            await Promise.race([
                img.decode().catch(() => {}),
                new Promise((ok) => setTimeout(ok, 1200))
            ]);
        } catch (e) {}

        limparAviso();
        esconderLoader();
        iniciarChef();
    });

    img.addEventListener('error', () => {
        aviso('Preçário sem ligação — a tentar novamente…');
        const id = setTimeout(carregar, 4000);
        temporizadores.push(id);
    });

    carregar();
}

function iniciarChef() {
    /* A imagem do preçário pode recarregar (rede fraca na TV) e cada
       carregamento voltava a criar outra logo e outro ciclo de animações:
       ficavam vários a tocar uns sobre os outros, e o registo mostrava
       «entrar» do mesmo clipe três vezes. Só existe uma. */
    const jaExiste = document.getElementById('logotipo');
    if (jaExiste) {
        posicionarChef(jaExiste);
        if (leitorLogo && typeof leitorLogo.atualizar === 'function') leitorLogo.atualizar(cfgAnim);
        registarLog('info', 'logo já existia (reutilizada)');
        return;
    }

    const caixa = document.createElement('div');
    caixa.id = 'logotipo';
    caixa.style.left = cfg.chef.x + '%';
    caixa.style.top = cfg.chef.y + '%';
    caixa.style.width = cfg.chef.largura + '%';
    palco.appendChild(caixa);

    /* Sem o módulo (ficheiro que não chegou), fica a logo em PNG. Com o
       módulo, o leitor trata de tudo — mesmo sem clipes escolhidos, porque
       é ele que faz o recorte do fundo verde. ?semanim=1 força a logo
       simples, para se perceber na TV o que está a causar um problema. */
    if (typeof Animacoes !== 'object' || semAnimacoes()) {
        const reserva = document.createElement('img');
        reserva.src = comVersao(ASSETS.logotipoReserva);
        reserva.alt = '';
        reserva.className = 'logo-original logo-a-vivo';
        reserva.style.width = '100%';
        reserva.style.display = 'block';
        caixa.appendChild(reserva);
        return;
    }

    leitorLogo = Animacoes.criarLeitor(caixa, cfgAnim);
    registarLog('info', 'leitor de animações criado · ' + ((cfgAnim.clips || []).length) + ' clipes');
}

function posicionarChef(caixa) {
    caixa.style.left = cfg.chef.x + '%';
    caixa.style.top = cfg.chef.y + '%';
    caixa.style.width = cfg.chef.largura + '%';
}

/* ------------------------------------------------------------------
   Camada anti-standby (TV2)
   Um vídeo H.264 de 1920x1080 esticado em ecrã inteiro por cima de todas
   as camadas, com 2% de opacidade: não se vê, mas a TV vê um vídeo a
   tocar. Ficou desligada por omissão porque na TV, com a camada a 100% e
   uma soma de cores, o ecrã ficou preto (a TV desenha vídeos à parte do
   CSS). Liga-se com ?vigia=1. Se a TV apagar por regra do próprio
   firmware (temporizador interno, modo hotel), nenhum site o impede.
   ------------------------------------------------------------------ */
function iniciarVigia() {
    if (document.getElementById('vigia')) return;

    const v = document.createElement('video');
    v.id = 'vigia';
    v.muted = true;
    v.defaultMuted = true;
    v.loop = true;
    v.autoplay = true;
    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.setAttribute('muted', '');
    v.setAttribute('aria-hidden', 'true');
    v.preload = 'auto';
    v.disablePictureInPicture = true;
    v.src = comVersao(ASSETS.vigia);

    document.getElementById('ecra').appendChild(v);

    /* O primeiro play() costuma ser recusado (o elemento acabou de nascer),
       por isso insiste-se nos primeiros segundos e sempre que a TV acorda. */
    tocar(v);
    [400, 1500, 4000, 9000, 20000].forEach((ms) => {
        temporizadores.push(setTimeout(() => { if (v.paused) tocar(v); }, ms));
    });
    vigiarVideo(v);
}

/* Interruptores de teste, para se perceber na TV o que causa um problema:
   ?vigia=1  — liga a camada anti-standby
   ?semanim=1 — desliga as animações (fica só a logo simples) */
function quereVigia() {
    const p = new URLSearchParams(location.search);
    return p.has('vigia') && p.get('vigia') !== '0';
}

function semAnimacoes() {
    const p = new URLSearchParams(location.search);
    return p.has('semanim') && p.get('semanim') !== '0';
}

/* Todos os vídeos do ecrã, arrancados de uma vez */
function tocarTudo() {
    document.querySelectorAll('video.media, video.logo-original, #vigia').forEach((v) => {
        if (v.paused) tocar(v);
    });
}


/* ------------------------------------------------------------------
   Arranque
   ------------------------------------------------------------------ */
async function arrancar() {
    await Promise.all([carregarConfig(), carregarAnimacoes()]);
    ajustarPalco(16 / 9, MODO === 'video');

    if (MODO === 'preco') {
        ecraPreco();
        if (quereVigia()) iniciarVigia();
    } else {
        ecraVideo();
    }

    desenharDecoracoes();
    iniciarVerificacaoAtualizacoes();
    manterAtivo();
}

/* ------------------------------------------------------------------
   MANTER TV ATIVA (anti-standby)
   ------------------------------------------------------------------
   Pede ao dispositivo para não apagar o ecrã (Screen Wake Lock).
   Funciona no Chrome/Edge/Android e num PC; o browser das TVs LG/Samsung
   não tem esta API, e aí o "ecrã desligado" é uma definição do painel.
   ------------------------------------------------------------------ */
let bloqueioEcra = null;
let aPedirEcra = false;

async function manterAtivo() {
    if (!('wakeLock' in navigator)) return;
    if (bloqueioEcra || aPedirEcra) return;
    if (document.visibilityState !== 'visible') return;

    aPedirEcra = true;
    try {
        bloqueioEcra = await navigator.wakeLock.request('screen');
        bloqueioEcra.addEventListener('release', () => { bloqueioEcra = null; });
    } catch (e) {
        // o dispositivo recusou (bateria fraca, política do browser…)
    }
    aPedirEcra = false;
}

manterAtivo();
setInterval(manterAtivo, 60000);
document.addEventListener('keydown', manterAtivo);

setInterval(() => {
    try {
        window.dispatchEvent(new Event('mousemove'));
        window.dispatchEvent(new Event('touchstart'));
    } catch (e) {}
}, 120000);

function iniciarAudioSilencioso() {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        gain.gain.value = 0.0001;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
    } catch (e) {}
}

document.addEventListener('click', iniciarAudioSilencioso, { once: true });
document.addEventListener('touchstart', iniciarAudioSilencioso, { once: true });
/* ------------------------------------------------------------------
   FORÇAR ATUALIZAÇÃO REMOTA
   ------------------------------------------------------------------ */
let versaoForcadaAtual = localStorage.getItem('mrpizza_forcar_v') || '0';
const URL_FORCAR = './forcar.json';

async function verificarForcar() {
    try {
        const res = await fetch(URL_FORCAR + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        const nova = String(data.versao || 0);
        if (versaoForcadaAtual === '0') {
            versaoForcadaAtual = nova;
            localStorage.setItem('mrpizza_forcar_v', nova);
            return;
        }
        if (nova !== versaoForcadaAtual) {
            localStorage.setItem('mrpizza_forcar_v', nova);
            setTimeout(() => location.reload(), 300);
        }
    } catch (e) {}
}

setInterval(verificarForcar, 10000);
verificarForcar();

window.addEventListener('resize', () => ajustarPalco(proporcao, cobrirEcra));
window.addEventListener('DOMContentLoaded', arrancar);

/*
 * ECRÃ CHEIO
 *
 * A TV dos menus está em ecrã cheio e não apaga; a dos preços mostra a
 * barra cinzenta do navegador. Além de ser feio, um ecrã cheio é a única
 * forma de a página ficar sem as barras do browser — e há painéis que
 * tratam de maneira diferente uma página em ecrã inteiro.
 *
 * O browser só deixa entrar em ecrã cheio depois de um toque no
 * telecomando, por isso: tenta-se ao arrancar (falha em silêncio) e em
 * qualquer tecla ou clique. Se ao fim de 15 s continuar sem ecrã cheio,
 * aparece uma dica pequena a pedir o OK — e desaparece sozinha quando
 * entrar.
 */
let dicaEcran = null;
let tentouEcranCheio = false;

async function entrarEcraCheio() {
    if (document.fullscreenElement) return true;

    const el = document.documentElement;
    try {
        if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch (e) {
        return false;
    }

    const ok = !!document.fullscreenElement;
    if (ok) {
        registarLog('info', 'ecrã cheio ligado');
        esconderDicaEcran();
    }
    return ok;
}

function mostrarDicaEcran() {
    if (dicaEcran || document.fullscreenElement) return;
    dicaEcran = document.createElement('div');
    dicaEcran.id = 'dica-ecran';
    dicaEcran.textContent = 'Ecrã inteiro: carrega OK no telecomando';
    document.body.appendChild(dicaEcran);
    registarLog('info', 'sem ecrã cheio — dica mostrada');
}

function esconderDicaEcran() {
    if (!dicaEcran) return;
    dicaEcran.remove();
    dicaEcran = null;
}

function tentarEcranCheio() {
    if (tentouEcranCheio || document.fullscreenElement) return;
    tentouEcranCheio = true;
    entrarEcraCheio();
}

document.addEventListener('fullscreenchange', () => {
    registarLog('info', document.fullscreenElement ? 'ecrã cheio: sim' : 'ecrã cheio: não');
    if (document.fullscreenElement) esconderDicaEcran();
    ajustarPalco(proporcao, cobrirEcra);
});

/* Qualquer toque no telecomando serve para entrar em ecrã cheio */
document.addEventListener('click', () => {
    entrarEcraCheio();
    tocarTudo();
    manterAtivo();
});

document.addEventListener('keydown', () => {
    entrarEcraCheio();
    tocarTudo();
    manterAtivo();
});

window.addEventListener('load', () => {
    setTimeout(tentarEcranCheio, 800);
    setTimeout(() => { if (!document.fullscreenElement) mostrarDicaEcran(); }, 15000);
    setTimeout(esconderDicaEcran, 45000);   // não fica a estorvar para sempre
});

/* Vigia os vídeos: se algum parar, volta a arrancar sozinho — é o que faz
   a imagem (e a camada anti-standby) voltar quando a TV «pestaneja» */
setInterval(() => {
    if (document.hidden) return;
    tocarTudo();
}, 15000);

/* Ao voltar do ecrã desligado, retoma o pedido e os vídeos */
document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    manterAtivo();
    tocarTudo();
});

/* ------------------------------------------------------------------
   DIAGNÓSTICO (escondido)
   Carregar em «0» no telecomando (ou abrir com ?diag=1) mostra, no próprio
   ecrã da TV, o que está a tocar: a camada anti-standby, a logo, os clipes
   e o bloqueio do ecrã. Serve para se perceber no restaurante o que falha
   sem precisar de ligar o PC à TV.
   ------------------------------------------------------------------ */
let caixaDiag = null;

function linhaDoDiag(nome, el) {
    if (!el) return nome + ': —';
    const ficheiro = (el.currentSrc || el.src || '').split('/').pop().split('?')[0];
    return nome + ': ' + ficheiro +
        ' · ' + (el.paused ? 'PARADO' : 'a tocar') +
        ' · rs' + el.readyState +
        ' · ' + el.currentTime.toFixed(1) + 's' +
        (el.videoWidth ? ' · ' + el.videoWidth + 'x' + el.videoHeight : ' · sem imagem') +
        ' · op' + (el.style.opacity === '' ? '1' : el.style.opacity) +
        (el.error ? ' · ERRO ' + el.error.code : '');
}

function textoDoDiag() {
    const telas = [...document.querySelectorAll('canvas')];
    const aPintar = telas.filter((t) => t.width > 1 && t.style.opacity !== '0').length;
    const clipes = [...document.querySelectorAll('video.clipe-logo')]
        .filter((v) => v.currentSrc || v.src);   // a segunda camada só tem fonte quando entra em cena

    return [
        'MR. PIZZA · diagnóstico',
        'versão ' + VERSAO + ' · ecrã ' + MODO + ' · ' + innerWidth + 'x' + innerHeight,
        'animações: ' + (typeof Animacoes === 'object' ? 'sim' : 'NÃO (animacoes.js)') +
            ' · clipes na lista: ' + ((cfgAnim && cfgAnim.clips) || []).length,
        'telas a pintar: ' + aPintar + ' · página: ' + document.visibilityState,
        document.getElementById('vigia')
            ? linhaDoDiag('vigia', document.getElementById('vigia'))
            : 'vigia: desligado (liga com ?vigia=1)',
        linhaDoDiag('logo', document.querySelector('video.logo-original')),
        'logo em uso: ' + (window.__animFallback
            ? 'PNG de reserva (o vídeo não abriu)'
            : 'vídeo animado'),
        'pintura: ' + (window.__animPintura
            ? window.__animPintura.fotogramas + ' fotogramas · ' +
              window.__animPintura.largura + 'px · ' + window.__animPintura.custo + ' ms'
            : 'ainda nada'),
        'eventos: ' + ((window.__animLog || []).slice(-3)
            .map((e) => e.evento + (e.extra ? ' ' + e.extra : '')).join(' · ') || 'sem eventos'),
        'versões: ' + versaoLocal() + ' · servidor ' + (versaoServidorVista || '—'),
        linhaDoDiag('clipe', clipes[0]),
        'wake lock: ' + (bloqueioEcra ? 'ativo' : 'não') +
            ' · ecrã cheio: ' + (document.fullscreenElement ? 'sim' : 'não'),
        'ligado há ' + Math.floor((Date.now() - ARRANQUE) / 60000) + ' min' +
            ' · vigia recomeçado ' + recomecosVigia + '×',
        'relógio ' + new Date().toLocaleTimeString('pt-PT'),
        '---- registo (mais recente em baixo) ----',
        ...((window.__logs || []).slice(-12).map((l) => {
            const s = Math.floor(l.t / 1000);
            const mm = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
            return mm + ' ' + l.nivel + ' ' + l.texto;
        }))
    ].join('\n');
}

function mostrarDiag(ligar) {
    if (!caixaDiag) {
        caixaDiag = document.createElement('pre');
        caixaDiag.id = 'diagnostico';
        document.body.appendChild(caixaDiag);
        setInterval(() => {
            if (caixaDiag && caixaDiag.style.display !== 'none') caixaDiag.textContent = textoDoDiag();
        }, 1000);
    }
    if (ligar) caixaDiag.textContent = textoDoDiag();
    caixaDiag.style.display = ligar ? 'block' : 'none';
}

if (new URLSearchParams(location.search).get('diag')) mostrarDiag(true);

document.addEventListener('keydown', (e) => {
    if (e.key !== '0' && e.code !== 'Digit0') return;
    mostrarDiag(!caixaDiag || caixaDiag.style.display === 'none');
});

/* ------------------------------------------------------------------
   Atualizações automáticas
   Compara o Last-Modified do HTML e do decoracoes.json. Se mudarem,
   avisa 5 s e recarrega.
   ------------------------------------------------------------------ */
/*
 * A comparação é feita pelos números de versão que o editor grava dentro
 * dos dois JSON, e não pelos cabeçalhos HTTP.
 *
 * Antes comparava-se o Last-Modified/ETag de quatro ficheiros: bastava um
 * pedido falhar na rede da TV para a «marca» mudar e a página recarregar
 * sem ninguém pedir — e, como o pedido voltava a falhar, ficava em ciclo
 * de 20 em 20 segundos, a cortar as animações a meio.
 *
 * Regras de agora: só se decide com os dois ficheiros lidos; o valor novo
 * tem de aparecer duas vezes seguidas; e no máximo um recarregamento
 * automático de 10 em 10 minutos.
 */
let confirmacoes = 0;
let aAtualizar = false;
let ultimaTentativa = 0;
const CHAVE_ATUALIZOU = 'mrpizza_ultima_atualizacao';
const ESPERA_ENTRE_ATUALIZACOES = 10 * 60 * 1000;

function versaoLocal() {
    return String((cfgAnim && cfgAnim.versao) || '') + '|' + String((cfg && cfg.versao) || '');
}

async function versaoNoServidor() {
    const ler = (url) => fetch(url + '?ver=' + Date.now(), { cache: 'no-store' })
        .then((r) => (r.ok ? r.json() : null))
        .catch(() => null);

    const [a, d] = await Promise.all([ler(ASSETS.animacoes), ler(ASSETS.config)]);
    if (!a || !d) return null;   // rede falhou: não se decide nada
    return String(a.versao || '') + '|' + String(d.versao || '');
}

function podeAtualizarAgora() {
    const agora = Date.now();
    let ultima = ultimaTentativa;
    try { ultima = Math.max(ultima, Number(localStorage.getItem(CHAVE_ATUALIZOU) || 0)); } catch (e) {}
    if (agora - ultima < ESPERA_ENTRE_ATUALIZACOES) return false;

    ultimaTentativa = agora;
    try { localStorage.setItem(CHAVE_ATUALIZOU, String(agora)); } catch (e) {}
    return true;
}

function recarregarComVersaoNova() {
    const u = new URL(location.href);
    u.searchParams.set('v', Date.now());
    location.replace(u.toString());
}

function avisarAtualizacao() {
    if (aAtualizar) return;
    aAtualizar = true;

    const caixa = document.createElement('div');
    caixa.id = 'aviso-atualizacao';
    caixa.innerHTML = '<p>A atualizar…</p><p id="contagem">' + SEGUNDOS_AVISO + '</p>';
    document.body.appendChild(caixa);

    let restantes = SEGUNDOS_AVISO;
    const contador = setInterval(() => {
        restantes--;
        const numero = document.getElementById('contagem');
        if (numero) numero.textContent = restantes > 0 ? restantes : '…';
        if (restantes <= 0) {
            clearInterval(contador);
            recarregarComVersaoNova();
        }
    }, 1000);
}

async function verificarAtualizacao() {
    if (aAtualizar) return;
    /* com o diagnóstico aberto não se recarrega: é preciso tempo para ler */
    if (caixaDiag && caixaDiag.style.display !== 'none') return;

    const v = await versaoNoServidor();
    if (!v) return;
    versaoServidorVista = v;

    if (v === versaoCarregada) { confirmacoes = 0; return; }

    /* primeira vez que se vê este valor: espera-se a confirmação seguinte */
    if (confirmacoes === 0) { confirmacoes = 1; return; }

    if (!podeAtualizarAgora()) return;
    avisarAtualizacao();
}

function iniciarVerificacaoAtualizacoes() {
    versaoCarregada = versaoLocal();
    versaoNoServidor().then((v) => { if (v) versaoServidorVista = v; });
    setInterval(verificarAtualizacao, INTERVALO_VERIFICACAO);
}
</script>
